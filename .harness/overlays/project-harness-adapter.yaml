project:
  name: matharc-research
  profile: core

# The project SSOT snapshot is archived in the local Obsidian iCloud vault.
# Keep the project bundle authoritative; the vault is an audit copy only.
archive:
  policy: required
  provider: obsidian-icloud
  root: /Users/vsiyo/Library/Mobile Documents/iCloud~md~obsidian/Documents/日记/开发/每日开发/SSOT合集
  require_collection_audit: true
design:
  token_sources: []
  theme_sources: []
  page_shell_sources: []
  component_sources: []
quality:
  static_guards:
    - PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m unittest -v tests.test_frozen_review_inputs
    - PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m unittest -v tests.test_v02_regression_evaluation
    - PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m unittest -v tests.test_v02_access tests.test_v02_access_server tests.test_console_prototype
    - PYTHONDONTWRITEBYTECODE=1 .venv/bin/python scripts/check_ui_copy_quality.py
    - PYTHONDONTWRITEBYTECODE=1 .venv/bin/python -m unittest -v tests.test_ui_copy_quality
  copy_lexicon: docs/quality-gates/ui-copy-lexicon.json
  formatting: []
  guard_policy:
    evidence_root: agents-results
    fast_budget_seconds: 30
    medium_budget_seconds: 180
    release_gate_commands:
      - python3 scripts/validate_frozen_review_inputs.py <campaign>/frozen-inputs.json --project-root .
qa:
  screenshot:
    - agents-results/2026-09-03/research-preview-access/screenshot-manifest.json
    - agents-results/2026-09-03/console-landing-copy-harness/evidence/screenshot-manifest.json
    - agents-results/2026-09-03/console-landing-copy-harness/evidence/landing-screenshot-manifest.json
  integration:
    - node scripts/console_browser_gate.mjs
  # MATHARC_GATE_EVIDENCE_DIR points a new task at its own evidence directory; MATHARC_GATE_FONT_MODE=fallback-local
  # declares a machine without the font CDN (view contract §9.13.4) instead of letting network state decide.
  evidence_root: agents-results

acceptance:
  evidence_lanes:
    persistent-runtime:
      # Stable project-owned collector identity for deployment/restart/recovery evidence.
      collector_key: matharc-persistent-runtime-v1
skills:
  enabled: []
