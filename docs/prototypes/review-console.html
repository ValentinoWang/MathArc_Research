<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathArc 核验台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ============ tokens: light is the base palette ============ */
:root {
  --ground: #F4F7F6;
  --surface: #FFFFFF;
  --surface-2: #EDF2F0;
  --ink: #1C2B2D;
  --muted: #5E7173;
  --line: #D5DEDC;
  --accent: #0F6B62;
  --accent-strong: #0A544D;
  --accent-soft: #E2EFEC;
  --ok: #2E7D4F;       --ok-soft: #E3F0E8;
  --gap: #B07818;      --gap-soft: #F6EDDA;
  --err: #B3362E;      --err-soft: #F6E3E1;
  --skip: #6B7280;     --skip-soft: #E9ECEF;
  --hash: #46605D;
  --focus: #0F6B62;
  --scrim: rgba(16, 28, 28, .45);
  --shadow: 0 1px 3px rgba(28,43,45,.08), 0 4px 16px rgba(28,43,45,.06);
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --topbar-h: 54px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #10191A;
    --surface: #172325;
    --surface-2: #1D2C2E;
    --ink: #E4ECEA;
    --muted: #93A6A4;
    --line: #2C3E40;
    --accent: #4FB3A5;
    --accent-strong: #6FCABB;
    --accent-soft: #163A36;
    --ok: #62B385;       --ok-soft: #17301F;
    --gap: #D9A64A;      --gap-soft: #3A2E14;
    --err: #E07A6F;      --err-soft: #3D1F1C;
    --skip: #9AA3AD;     --skip-soft: #262B31;
    --hash: #8FB4AE;
    --focus: #4FB3A5;
    --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --ground: #10191A;
  --surface: #172325;
  --surface-2: #1D2C2E;
  --ink: #E4ECEA;
  --muted: #93A6A4;
  --line: #2C3E40;
  --accent: #4FB3A5;
  --accent-strong: #6FCABB;
  --accent-soft: #163A36;
  --ok: #62B385;       --ok-soft: #17301F;
  --gap: #D9A64A;      --gap-soft: #3A2E14;
  --err: #E07A6F;      --err-soft: #3D1F1C;
  --skip: #9AA3AD;     --skip-soft: #262B31;
  --hash: #8FB4AE;
  --focus: #4FB3A5;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14.5px;
  line-height: 1.65;
}
button { font-family: inherit; font-size: inherit; cursor: pointer; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ============ top bar ============ */
.topbar {
  display: flex; align-items: center; gap: 12px;
  height: var(--topbar-h);
  padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30;
}
.iconbtn {
  border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 7px; padding: 4px 10px; font-size: 12.5px; color: var(--muted);
  white-space: nowrap; flex: none;
}
.iconbtn:hover { color: var(--accent); border-color: var(--accent); }
#btn-queue { display: none; }
.brand { display: flex; align-items: baseline; gap: 8px; flex: none; }
.brand .mark {
  font-family: var(--serif); font-weight: 700; font-size: 16.5px;
  color: var(--accent); letter-spacing: .02em; white-space: nowrap;
}
.brand .sub { font-size: 11px; color: var(--muted); letter-spacing: .12em; white-space: nowrap; }
.nowtask {
  min-width: 0; flex: 1;
  font-size: 13px; color: var(--muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.nowtask b { color: var(--ink); font-weight: 500; }
.miniprog {
  flex: none; font-family: var(--mono); font-size: 12px; color: var(--accent);
  font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.draftstate { flex: none; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.draftstate.saved { color: var(--ok); }

/* ============ shell layout (desktop-first, breakpoint at 1280) ============ */
.shell {
  display: grid;
  grid-template-columns: 232px minmax(0,1fr) 292px;
  gap: 16px;
  max-width: 1420px;
  margin: 0 auto;
  padding: 16px 18px 40px;
  align-items: start;
}

/* left rail */
.rail {
  position: sticky; top: calc(var(--topbar-h) + 12px);
  max-height: calc(100dvh - var(--topbar-h) - 24px);
  overflow-y: auto; scrollbar-width: thin;
  display: flex; flex-direction: column; gap: 12px;
}
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow);
}
.card > .card-h {
  padding: 9px 13px 7px;
  font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--muted);
  border-bottom: 1px solid var(--line);
}
.queue { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
.queue button {
  width: 100%; text-align: left; background: none; border: 1px solid transparent;
  border-radius: 8px; padding: 8px 10px;
  display: flex; flex-direction: column; gap: 3px;
  transition: background .12s;
}
.queue button:hover { background: var(--surface-2); }
.queue button.active { background: var(--accent-soft); border-color: var(--accent); }
.queue .q-title { font-size: 12.5px; font-weight: 500; line-height: 1.4; }
.queue .q-meta { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 500; padding: 1px 8px; border-radius: 20px;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.pill.ok    { background: var(--ok-soft);  color: var(--ok);  border-color: transparent; }
.pill.gap   { background: var(--gap-soft); color: var(--gap); border-color: transparent; }
.pill.err   { background: var(--err-soft); color: var(--err); border-color: transparent; }
.pill.acc   { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.reviewer { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 7px; }
.reviewer .rv-name { font-weight: 700; font-size: 13.5px; }
.reviewer .rv-line { font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
.conflictbox {
  padding: 8px 10px; border-radius: 8px;
  background: var(--surface-2); border: 1px dashed var(--line);
  display: flex; gap: 8px; align-items: flex-start; font-size: 11.5px; color: var(--muted);
  line-height: 1.55;
}
.conflictbox input { margin-top: 3px; accent-color: var(--accent); flex: none; }
.conflictbox.done { border-style: solid; border-color: var(--ok); color: var(--ink); }

/* ============ main column ============ */
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.claimhead { padding: 16px 18px 15px; }
.claimhead .eyebrow { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-bottom: 9px; }
.claimhead .cid { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 600; }
.claimhead h1 {
  font-family: var(--serif); font-weight: 700;
  font-size: 19.5px; line-height: 1.6; margin: 0 0 8px; text-wrap: balance;
}
.claimhead .scopeline { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.claimhead .scopeline b { color: var(--ink); font-weight: 500; }
.assurance { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 11px; }
.assurance .av {
  font-size: 11px; padding: 2px 9px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--line);
}
.assurance .av b { color: var(--muted); font-weight: 500; margin-right: 4px; }
.assurance .label {
  font-size: 11px; padding: 2px 10px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent); font-weight: 700;
}

.sect > .sect-h {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 11px 18px 9px; border-bottom: 1px solid var(--line);
}
.sect > .sect-h h2 { font-size: 14px; font-weight: 700; margin: 0; }
.sect > .sect-h .hint { font-size: 11.5px; color: var(--muted); margin-left: auto; }
.collapse-h { cursor: pointer; user-select: none; }
.collapse-h .tri { color: var(--muted); font-size: 11px; transition: transform .15s; display: inline-block; }
.sect.open .collapse-h .tri { transform: rotate(90deg); }
.sect .sect-body { display: none; }
.sect.open .sect-body { display: block; }
.sect.always .sect-body { display: block; }

/* statement correspondence highlight */
.corr {
  margin: 13px 18px 16px; padding: 13px 15px;
  border: 1.5px solid var(--accent); border-radius: 10px;
  background: var(--accent-soft);
}
.corr .corr-tag { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--accent); margin-bottom: 5px; }
.corr p { margin: 0 0 6px; font-size: 13px; }
.corr .stmt { font-family: var(--serif); font-size: 14px; line-height: 1.8; }
.corr .subnote { margin: 0; font-size: 12px; color: var(--muted); }

/* obligation toolbar */
.obtools {
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  padding: 10px 14px 2px;
}
.filterchip {
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  border-radius: 20px; padding: 2px 11px; font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}
.filterchip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 600; }
.nextbtn {
  margin-left: auto;
  border: 1px solid var(--accent); background: var(--surface); color: var(--accent);
  border-radius: 7px; padding: 3px 12px; font-size: 12px; font-weight: 500;
}
.nextbtn:hover { background: var(--accent-soft); }
.nextbtn .k { font-family: var(--mono); font-size: 10px; opacity: .7; margin-left: 4px; }

/* obligations */
.oblist { list-style: none; margin: 0; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ob {
  border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
  padding: 11px 13px;
  display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 11px;
  transition: border-color .12s, background .12s;
}
.ob.hiddenrow { display: none; }
.ob.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.ob.v-ok   { background: color-mix(in srgb, var(--ok-soft) 45%, var(--surface)); }
.ob.v-gap  { background: color-mix(in srgb, var(--gap-soft) 45%, var(--surface)); }
.ob.v-err  { background: color-mix(in srgb, var(--err-soft) 45%, var(--surface)); }
.ob .ob-no {
  font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--muted);
  padding-top: 2px; grid-row: span 3;
}
.ob .ob-text { font-size: 13.5px; line-height: 1.7; overflow-wrap: anywhere;
  display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ob .ob-title { font-size: 14.5px; font-weight: 700; line-height: 1.5; }
.ob .ob-ask { color: var(--ink); }
.ob .ob-points { margin: 2px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.ob .ob-points li { font-size: 12.5px; color: var(--muted); line-height: 1.65; }
.ob .ob-ref { font-size: 11.5px; color: var(--muted); font-style: italic; }
.ob .ob-text .req {
  font-size: 10.5px; font-weight: 500; color: var(--muted); border: 1px solid var(--line);
  border-radius: 5px; padding: 0 6px; margin-left: 7px; white-space: nowrap; vertical-align: 2px;
}
.ob .ob-ev { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 11.5px; color: var(--muted); }
.evchip {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--accent);
  border-radius: 20px; padding: 1px 10px; font-size: 11px;
}
.evchip:hover { border-color: var(--accent); }
.ob .ob-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
.vbtn {
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  border-radius: 7px; padding: 4px 12px; font-size: 12.5px; font-weight: 500;
  transition: all .1s;
}
.vbtn:hover { border-color: var(--muted); color: var(--ink); }
.vbtn.on-ok   { background: var(--ok);   border-color: var(--ok);   color: #fff; }
.vbtn.on-gap  { background: var(--gap);  border-color: var(--gap);  color: #fff; }
.vbtn.on-err  { background: var(--err);  border-color: var(--err);  color: #fff; }
.vbtn.on-skip { background: var(--skip); border-color: var(--skip); color: #fff; }
.vbtn .k { font-family: var(--mono); font-size: 10px; opacity: .65; margin-left: 5px; }
.ob textarea {
  width: 100%; margin-top: 8px; min-height: 52px; resize: vertical;
  border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px;
  background: var(--surface); color: var(--ink);
  font-family: var(--sans); font-size: 13px; line-height: 1.6;
}
.ob .note-req { font-size: 11.5px; color: var(--err); margin-top: 4px; }

/* ============ evidence cards (view-model rendered) ============ */
.evlist { padding: 12px; display: grid; gap: 10px; }
.ev {
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 7px; min-width: 0;
}
.ev .ev-top { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; min-width: 0; }
.ev .ev-title { font-weight: 700; font-size: 13.5px; overflow-wrap: anywhere; }
.kind { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 1px 8px; border-radius: 5px; white-space: nowrap; }
.kind.exact  { background: var(--accent-soft); color: var(--accent); }
.kind.human  { background: var(--gap-soft);    color: var(--gap); }
.kind.lit    { background: var(--skip-soft);   color: var(--skip); }
.ev .ev-proves { font-size: 13px; overflow-wrap: anywhere; }
.ev .ev-lim { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.ev .ev-lim b { color: var(--ink); font-weight: 500; }
.ev .warnband {
  font-size: 11.5px; color: var(--gap); background: var(--gap-soft);
  border-radius: 6px; padding: 5px 10px;
}
.ev .ev-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.smallbtn {
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font-size: 11.5px; border-radius: 6px; padding: 3px 11px; white-space: nowrap;
}
.smallbtn:hover { color: var(--accent); border-color: var(--accent); }
.techgrid {
  display: none;
  grid-template-columns: auto minmax(0,1fr); gap: 4px 14px;
  margin-top: 4px; padding: 10px 12px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px;
  font-size: 11.5px;
}
.ev.tech-open .techgrid { display: grid; }
.techgrid .tk { color: var(--muted); white-space: nowrap; }
.techgrid .tv { font-family: var(--mono); font-size: 11px; color: var(--hash);
  overflow-wrap: anywhere; min-width: 0; }
.techgrid .tv .copybtn { margin-left: 6px; }
.copybtn {
  border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  font-size: 10.5px; border-radius: 5px; padding: 1px 8px; white-space: nowrap;
}
.copybtn:hover { color: var(--accent); border-color: var(--accent); }

/* deps + attacks */
.depwrap { padding: 13px 18px 4px; overflow-x: auto; }
.attacks { list-style: none; margin: 0; padding: 8px 18px 15px; display: flex; flex-direction: column; gap: 8px; }
.attack {
  border-left: 3px solid var(--err); border-radius: 4px;
  background: var(--surface-2); padding: 9px 12px; font-size: 12.5px; min-width: 0;
}
.attack.routelevel { border-left-color: var(--gap); }
.attack.passed { border-left-color: var(--ok); }
.attack .a-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 3px; }
.attack .a-name { font-weight: 600; font-size: 12px; }
.attack .a-class {
  font-size: 10.5px; font-weight: 600; padding: 0 7px; border-radius: 4px;
  color: var(--err); background: var(--err-soft);
}
.attack.routelevel .a-class { color: var(--gap); background: var(--gap-soft); }
.attack.passed .a-class { color: var(--ok); background: var(--ok-soft); }
.attack .a-body { color: var(--muted); overflow-wrap: anywhere; }
.attack .a-body b { color: var(--ink); font-weight: 600; }

/* ============ verdict panel ============ */
.verdictpanel {
  position: sticky; top: calc(var(--topbar-h) + 12px);
  max-height: calc(100dvh - var(--topbar-h) - 24px);
  overflow-y: auto; scrollbar-width: thin;
  background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
}
.vbar { display: none; }
.vp-scroll { padding: 13px 15px 15px; display: flex; flex-direction: column; gap: 12px; }
.progress { display: flex; align-items: center; gap: 12px; }
.ring { width: 54px; height: 54px; flex: none; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--accent); transition: stroke-dashoffset .3s; }
.ring text { fill: var(--ink); font-family: var(--mono); font-size: 13px; font-weight: 600; }
.progress .p-lines { font-size: 12px; color: var(--muted); line-height: 1.5; min-width: 0; }
.progress .p-lines b { color: var(--ink); font-variant-numeric: tabular-nums; }
.dist { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }

.verdicts { display: flex; flex-direction: column; gap: 7px; }
.bigv {
  width: 100%; text-align: left; border-radius: 9px; padding: 8px 12px;
  border: 1.5px solid var(--line); background: var(--surface);
  display: flex; flex-direction: column; gap: 1px;
  transition: all .12s;
}
.bigv .t { font-weight: 700; font-size: 13px; }
.bigv .d { font-size: 10.5px; color: var(--muted); line-height: 1.45; }
.bigv:not(:disabled):hover { border-color: var(--muted); }
.bigv.sel-approve { border-color: var(--ok);  background: var(--ok-soft); }
.bigv.sel-changes { border-color: var(--gap); background: var(--gap-soft); }
.bigv.sel-reject  { border-color: var(--err); background: var(--err-soft); }
.bigv:disabled { opacity: .45; cursor: not-allowed; }
.blockers { font-size: 11.5px; color: var(--muted); line-height: 1.6; margin: 0; padding: 0 0 0 16px; }
.blockers .allclear { color: var(--ok); list-style: none; margin-left: -16px; }

.channels {
  border: 1.5px solid var(--err); border-radius: 9px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 8px; background: var(--surface);
}
.channels .ch-h { font-size: 12px; font-weight: 700; color: var(--err); }
.channels label { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; cursor: pointer; line-height: 1.5; }
.channels input[type=radio] { margin-top: 3px; accent-color: var(--err); flex: none; }
.channels .ch-name { font-weight: 700; }
.channels .ch-desc { color: var(--muted); }
.channels input[type=text] {
  width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px;
  font-family: var(--mono); font-size: 11.5px; background: var(--surface); color: var(--ink);
}
.channels .ch-warn { font-size: 11px; color: var(--err); }

.submitbtn {
  width: 100%; border: none; border-radius: 9px; padding: 11px;
  background: var(--accent); color: #fff; font-weight: 700; font-size: 13.5px;
  transition: background .12s;
}
.submitbtn:not(:disabled):hover { background: var(--accent-strong); }
.submitbtn:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
.vp-foot { display: flex; justify-content: space-between; gap: 8px; }
.linkbtn { background: none; border: none; color: var(--muted); font-size: 11.5px; text-decoration: underline; padding: 0; }
.linkbtn:hover { color: var(--accent); }

/* submitted (read-only) view */
.submitted-banner {
  margin: 13px 18px; padding: 12px 15px; border-radius: 10px;
  background: var(--ok-soft); border: 1px solid var(--ok); font-size: 13px;
}
.submitted-banner b { color: var(--ok); }

/* ============ evidence drawer ============ */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 70;
  width: min(430px, 100%);

}
.drawer.open { transform: translateX(0); }

}
.scrim.show { opacity: 1; pointer-events: auto; }

.modal {

.m-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  border: 1px solid var(--line); background: var(--surface); color: var(--ink);

}

.infogrid .tk { color: var(--muted); white-space: nowrap; }
.infogrid .tv { font-family: var(--mono); font-size: 11px; color: var(--hash); overflow-wrap: anywhere; }
.helpgrid { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }
.helpgrid kbd {

.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);

  border-radius: 8px; padding: 8px 16px; z-index: 90; box-shadow: var(--shadow);
  max-width: 90vw;
}
.serifstmt { font-family: var(--serif); }
.hidden { display: none !important; }

/* ============ tablet: <1280px ============ */
@media (max-width: 1279px) {

/* ---------- draft persistence ----------
   仅为单机浏览器便利。生产环境：草稿存服务端并绑定
   reviewer + tenant + bundle 权限，登出即清，绝不放 token。 */
const LS_KEY = "matharc-review-draft:" + ROSTER.reviewer.id;
const DRAFT_TTL_MS = 7 * 24 * 3600 * 1000;
function saveDraft() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ savedAt: Date.now(), perBundle: state.perBundle }));
    const el = $("draftstate");
    const t = new Date();
    el.textContent = "草稿已保存 " + String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
    el.classList.add("saved");
  } catch (e) { /* storage unavailable: page still fully works */ }
}
function loadDraft() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && parsed.savedAt && Date.now() - parsed.savedAt < DRAFT_TTL_MS) {
      state.perBundle = parsed.perBundle || {};
    } else { localStorage.removeItem(LS_KEY); }
  } catch (e) { state.perBundle = {}; }
}

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
/* attacks: structured {summary, emphasis[]} -> escaped html with <b> wraps; never trusts raw HTML */
function emphasize(summary, emphasis) {
  let html = esc(summary);
  for (const item of emphasis || []) {
    const needle = esc(item);
    html = html.split(needle).join("<b>" + needle + "</b>");
  }
  return html;
}

/* ---------- dependency SVG ---------- */
function depSVG(deps) {
  const W = 540, H = 152, stateColor = {
    proved: "var(--ok)", verified: "var(--ok)", candidate: "var(--gap)",
    review: "var(--accent)", open: "var(--muted)",
  };
  let lines = "";
  for (const [a, b] of deps.edges) {
    const na = deps.nodes.find(n => n.id === a), nb = deps.nodes.find(n => n.id === b);
    lines += `<line x1="${na.x+52}" y1="${na.y}" x2="${nb.x-52}" y2="${nb.y}"
      stroke="var(--line)" stroke-width="1.5" marker-end="url(#arr)"></line>`;
  }
  let nodes = "";
  for (const n of deps.nodes) {
    const c = stateColor[n.state] || "var(--muted)";
    const strong = n.state === "review";
    nodes += `<g>
      <rect x="${n.x-52}" y="${n.y-17}" width="104" height="34" rx="8"
        fill="var(--surface)" stroke="${c}" stroke-width="${strong?2:1.2}"></rect>
      <text x="${n.x}" y="${n.y+4}" text-anchor="middle"
        font-size="11" fill="${strong?c:"var(--ink)"}" font-weight="${strong?"700":"400"}">${esc(n.label)}</text></g>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%" role="img" aria-label="依赖关系图">
    <defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0.5 L7.5,4 L0,7.5 Z" fill="var(--muted)"></path></marker></defs>
    ${lines}${nodes}</svg>`;
}

        ${ob.ref ? `<span class="ob-ref">${esc(ob.ref)}</span>` : ""}
      </span>

        ${verdictBtn(ob.id, "gap", "缺口", "2", v)}

          ${!(st.notes[ob.id]||"").trim() ? `<div class="note-req">「${v==="gap"?"缺口":"错误"}」必须附说明才能提交</div>` : ""}

  const evCards = b.evidence.map(ev => evidenceCard(ev)).join("");

    <li class="attack ${a.level==="route"?"routelevel":a.level==="pass"?"passed":""}">

      <div class="a-body">${emphasize(a.summary, a.emphasis)}</div>
    </li>`).join("");

  main.innerHTML = `
    <div class="card claimhead">
      <div class="eyebrow">
        <span class="cid">${b.claimId} · rev.${b.claimRevision}</span>
        <span class="pill acc">${esc(b.kindPill)}</span>
        <span class="pill">${esc(b.source)}</span>
      </div>
      <h1 class="serifstmt">${esc(b.statement)}</h1>
      <div class="scopeline">
        <span><b>适用范围</b>　${esc(b.scope)}</span>
        <span><b>不主张</b>　${esc(b.boundary)}</span>
      </div>
      <div class="assurance">${av}</div>
    </div>

    <div class="card sect always">
      <div class="sect-h"><h2>先核对：白话说的是不是同一件事</h2>
        <span class="hint">这一步最容易被含糊带过，因此单列一节</span></div>
      <div class="sect-body">
        <div class="corr">
          <div class="corr-tag">上面那句正式命题的白话转述</div>
          <p><span class="stmt">${esc(b.informal)}</span></p>
          <p class="subnote">这一条的裁决在下面第一条义务里给出。只有它判为「通过」，整份结论才可能整体通过。</p>
        </div>
      </div>
    </div>

    <div class="card sect always">
      <div class="sect-h"><h2>义务清单</h2><span class="hint">j/k 移动 · 1–4 裁决 · n 下一条未核验</span></div>
      <div class="sect-body">
        <div class="obtools">${filters}
          <button class="nextbtn" id="btn-next">下一条未核验<span class="k">n</span></button></div>
        <ul class="oblist" id="oblist">${obs}</ul>
      </div>
    </div>

    <div class="card sect" id="sect-evidence">
      <div class="sect-h collapse-h" data-toggle="sect-evidence"><span class="tri">▶</span>
        <h2>全部证据（${b.evidence.length}）</h2>
        <span class="hint">核验时通常不必展开——义务行内可直接打开对应证据</span></div>
      <div class="sect-body"><div class="evlist">${evCards}</div></div>
    </div>

    <div class="card sect" id="sect-deps">
      <div class="sect-h collapse-h" data-toggle="sect-deps"><span class="tri">▶</span>
        <h2>这条结论依赖什么、被怎么攻击过</h2>
        <span class="hint">需要背景时再展开</span></div>
      <div class="sect-body">
        <div class="depwrap">${depSVG(b.deps)}</div>
        <ul class="attacks">${attacks}</ul>
      </div>
    </div>`;

  // wire up
  main.querySelectorAll(".vbtn").forEach(btn => btn.addEventListener("click", () =>
    setVerdict(btn.dataset.ob, btn.dataset.v)));
  main.querySelectorAll("textarea[data-note]").forEach(t => {
    t.addEventListener("input", () => {
      bstate(b.id).notes[t.dataset.note] = t.value;
      saveDraft(); updatePanel();
      const warn = t.closest(".ob").querySelector(".note-req");
      if (warn) warn.style.display = t.value.trim() ? "none" : "";
    });
  });
  main.querySelectorAll(".evchip[data-ev]").forEach(chip =>
    chip.addEventListener("click", (e) => {
      e.stopPropagation();
      const obIndex = Number(chip.closest(".ob").dataset.obi);
      openEvidenceDrawer(chip.dataset.ev, (b.obligations[obIndex] || {}).title);
    }));
  main.querySelectorAll(".filterchip").forEach(chip =>
    chip.addEventListener("click", () => { state.filter = chip.dataset.filter; renderMain(); }));
  const nextBtn = $("btn-next");
  if (nextBtn) nextBtn.addEventListener("click", gotoNextPending);
  main.querySelectorAll(".collapse-h").forEach(h =>
    h.addEventListener("click", () => $(h.dataset.toggle).classList.toggle("open")));
  main.querySelectorAll(".ob").forEach(row => row.addEventListener("click", (e) => {
    if (e.target.closest("button, textarea, a")) return;
    state.cursor = Number(row.dataset.obi); highlightCursor();
  }));
  wireEvidenceCard(main);
}

function setVerdict(obId, v) {
  const st = bstate(state.current);
  st.verdicts[obId] = (st.verdicts[obId] === v) ? undefined : v;
  if (st.verdicts[obId] === undefined) delete st.verdicts[obId];
  saveDraft(); renderMain(); renderQueue(); updatePanel();
}
function highlightCursor() {
  document.querySelectorAll(".ob").forEach(el =>
    el.classList.toggle("current", Number(el.dataset.obi) === state.cursor));
  const row = $("obrow-" + state.cursor);
  if (row) row.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function gotoNextPending() {
  const b = BUNDLES[state.current]; if (!b) return;
  const st = bstate(b.id);
  const n = b.obligations.length;
  for (let step = 1; step <= n; step++) {
    const i = (state.cursor + step) % n;
    if (!st.verdicts[b.obligations[i].id]) { state.cursor = i; highlightCursor(); return; }
  }
  toast("没有未核验的义务了");
}

/* ---------- evidence drawer (opens beside the current obligation) ---------- */
function openEvidenceDrawer(evId, obLabel) {

function closeDrawer() {

function openRail() { $("rail").classList.add("open"); $("scrim").classList.add("show"); }
function closeRail() {
  $("rail").classList.remove("open");
  if (!$("evdrawer")) $("scrim").classList.remove("show");
}

/* ---------- verdict panel logic ---------- */
function counts() {
  const b = BUNDLES[state.current];
  if (!b) return { ok:0, gap:0, err:0, skip:0, total:0, done:0, missingNotes:[], corrOk:false };
  const st = bstate(b.id);
  const c = { ok: 0, gap: 0, err: 0, skip: 0, total: b.obligations.length, done: 0, missingNotes: [] };
  for (const ob of b.obligations) {
    const v = st.verdicts[ob.id];
    if (v) { c[v]++; c.done++; }
    if ((v === "gap" || v === "err") && !(st.notes[ob.id] || "").trim()) c.missingNotes.push(ob.id);
  }
  c.corrOk = st.verdicts["OB-0"] === "ok";
  return c;
}

function updatePanel() {
  const sub = SUBMITTED[state.current];
  if (sub) return; // topbar handled in renderMain for submitted view
  const b = BUNDLES[state.current]; if (!b) return;
  const st = bstate(b.id);
  const c = counts();

  $("miniprog").textContent = c.done + "/" + c.total;
  $("p-done").textContent = c.done; $("p-total").textContent = c.total;
  $("ring-text").textContent = c.done + "/" + c.total;
  const C = 138.2;
  $("ring-fg").style.strokeDashoffset = String(C * (1 - (c.total ? c.done / c.total : 0)));
  $("dist").innerHTML =
    `<span class="pill ok">通过 ${c.ok}</span><span class="pill gap">缺口 ${c.gap}</span>` +
    `<span class="pill err">错误 ${c.err}</span><span class="pill">无法判断 ${c.skip}</span>`;
  $("vb-prog").textContent = c.done + "/" + c.total + " 已核验";
  $("vb-sum").textContent =
    (c.gap ? `${c.gap} 个缺口` : "") + (c.err ? `　${c.err} 个错误` : "") ||
    (c.done === c.total ? "全部义务已核验" : "继续逐条核验");

  // one-way: state -> checkbox (listener writes the other direction)
  $("conflict-check").checked = !!st.conflict;
  $("conflictbox").classList.toggle("done", !!st.conflict);

  const allJudged = c.done === c.total;
  const allOk = allJudged && c.ok === c.total;
  const canApprove = allOk && st.conflict;
  const canChanges = c.gap >= 1 && c.missingNotes.length === 0 && st.conflict && allJudged;
  const canReject = allJudged && st.conflict && (c.err >= 1 || c.gap >= 1 || c.skip >= 1);

  const bA = $("v-approve"), bC = $("v-changes"), bR = $("v-reject");
  bA.disabled = !canApprove; bC.disabled = !canChanges; bR.disabled = !canReject;
  bA.classList.toggle("sel-approve", st.verdict === "APPROVE");
  bC.classList.toggle("sel-changes", st.verdict === "REQUEST_CHANGES");
  bR.classList.toggle("sel-reject", st.verdict === "REJECT");
  if ((st.verdict === "APPROVE" && !canApprove) || (st.verdict === "REQUEST_CHANGES" && !canChanges) ||
      (st.verdict === "REJECT" && !canReject)) st.verdict = null;

  $("channels").classList.toggle("hidden", st.verdict !== "REJECT");
  const wi = $("witness-input");
  wi.classList.toggle("hidden", st.channel !== "claim_counterexample");
  document.querySelectorAll('input[name=ch]').forEach(r => { r.checked = (r.value === st.channel); });
  if (wi.value !== st.witness) wi.value = st.witness;
  const chWarn = $("ch-warn");
  if (st.verdict === "REJECT" && st.channel === "claim_counterexample" && !st.witness.trim()) {
    chWarn.textContent = "选择「结论本身是错的」必须填写一份已被独立核验的反例编号，否则不能提交——这样专家意见才不会被当成数学否证。";
    chWarn.classList.remove("hidden");
  } else chWarn.classList.add("hidden");

  // contextual blockers: only show what is still unmet
  const unmet = [];
  if (!allJudged) unmet.push(`还有 ${c.total - c.done} 条义务未裁决`);
  if (c.missingNotes.length) unmet.push(`缺口/错误缺少说明：${c.missingNotes.join("、")}`);
  if (!st.conflict) unmet.push("利益冲突声明未勾选");
  if (st.verdict === "APPROVE" && !c.corrOk) unmet.push("白话转述那一条尚未判为「通过」");
  if (st.verdict === "REJECT" && !st.channel) unmet.push("未选择这是哪一种「不通过」");
  if (st.verdict === "REJECT" && st.channel === "claim_counterexample" && !st.witness.trim())
    unmet.push("未填写反例的编号");
  $("blockers").innerHTML = unmet.length
    ? unmet.map(t => `<li>${esc(t)}</li>`).join("")
    : `<li class="allclear">✓ 所有前置条件已满足${st.verdict ? "" : "——请选择整体裁决"}</li>`;

  const submittable = !!st.verdict &&
    (st.verdict !== "REJECT" || (!!st.channel && (st.channel !== "claim_counterexample" || !!st.witness.trim())));
  const VERDICT_CN = { APPROVE: "通过", REQUEST_CHANGES: "要求修改", REJECT: "拒绝" };
  $("submitbtn").disabled = !submittable;
  $("submitbtn").textContent = st.verdict ? `提交核验记录：${VERDICT_CN[st.verdict]}` : "提交核验记录";
}

/* ---------- ReviewRecord assembly (full digests, never display strings) ---------- */
function buildRecord() {
  const b = BUNDLES[state.current];
  const st = bstate(b.id);
  const vMap = { ok: "OK", gap: "GAP", err: "ERROR", skip: "CANNOT_JUDGE" };
  return {
    schema_version: "matharc.v02.review-record.1",
    review_id: "REV-" + b.id + "-" + ROSTER.reviewer.id,
    claim_id: b.claimId,
    claim_revision: b.claimRevision,
    statement_digest_sha256: b.statementDigestFull,
    bundle_digest_sha256: b.bundleDigestFull,
    reviewer: {
      reviewer_id: ROSTER.reviewer.id,
      independence_group: ROSTER.reviewer.group,
      roster_version: ROSTER.version,
      roster_digest_sha256: ROSTER.digest,
      conflict_declaration: st.conflict,
    },
    review_policy_version: POLICY_VERSION,
    obligation_verdicts: b.obligations.map(ob => ({
      obligation_id: ob.id,
      required_assurance: ob.req,
      verdict: vMap[st.verdicts[ob.id]] || "PENDING",
      note: (st.notes[ob.id] || "").trim() || undefined,
    })),
    statement_correspondence_checked: st.verdicts["OB-0"] === "ok",
    verdict: st.verdict,
    reject_channel: st.verdict === "REJECT" ? st.channel : undefined,
    counterexample_artifact_id:
      st.channel === "claim_counterexample" ? st.witness.trim() : undefined,
    lifecycle: "ACTIVE",
    review_signature: "ed25519:PROTOTYPE-PLACEHOLDER",
    created_at: new Date().toISOString(),
  };
}
async function chainDigest(json) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(PREV_HEAD + json));
    return Array.from(new Uint8Array(buf)).map(x => x.toString(16).padStart(2, "0")).join("");
  } catch (e) { return null; }
}

async function openRecordModal(final) {
  const b = BUNDLES[state.current]; if (!b) return;
  const rec = buildRecord();
  const json = JSON.stringify(rec, null, 2);
  const newHead = await chainDigest(json);
  openModal(`
    <div class="m-h"><h3>${final ? "核验记录已生成（原型演示）" : "ReviewRecord 预览"}</h3>
      <button class="x" data-close aria-label="关闭">✕</button></div>
    <div class="m-b">
      ${final && newHead ? `<div class="chainviz">
          <span class="node">…${PREV_HEAD.slice(0,12)}</span><span class="arrow">→</span>
          <span class="node new">${newHead.slice(0,12)}…（本记录）</span>
        </div>` : ""}
      <pre>${esc(json)}</pre>
      <div class="m-note">这是提交后写入系统的原始记录（开发者视角）。真实提交时，系统会先自动检查你是否有资格评审这份材料，
        再把记录追加进不可篡改的日志；判为「通过」时同时生成一份以你名义的专家核验证据。
        记录锁定在结论的第 ${b.claimRevision} 版——语句一旦修订或你撤回意见，它会自动失效。
        文件里的指纹字段一律是完整长度，界面上显示的缩略形式只用于阅读。</div>

  document.querySelector("[data-copyjson]").addEventListener("click", () => copyText(json));

/* ---------- misc ---------- */
function copyText(text) {
  const done = () => toast("已复制到剪贴板");
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  } catch (e) { fallbackCopy(text, done); }
}
function fallbackCopy(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); done(); } catch (e) { toast("复制失败，请手动选择"); }
  document.body.removeChild(ta);
}
let toastTimer = null;
function toast(msg) {
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 1800);
}

/* selectBundle: restore the NEW bundle's own state before any panel update,
   so conflict declarations and drafts never bleed across bundles. */
function selectBundle(id) {
  state.current = id; state.cursor = 0; state.filter = "all";
  closeDrawer();
  const sub = SUBMITTED[id];
  if (!sub) $("conflict-check").checked = !!bstate(id).conflict;
  renderQueue(); renderMain(); updatePanel();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- events ---------- */
document.addEventListener("keydown", (e) => {
  if (e.target.matches("textarea, input")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "Escape") { $("modal-root").innerHTML = ""; closeDrawer(); closeRail(); return; }
  if (e.key === "?") { openHelp(); return; }
  const b = BUNDLES[state.current]; if (!b) return;
  if (e.key === "j") { state.cursor = Math.min(state.cursor + 1, b.obligations.length - 1); highlightCursor(); }
  if (e.key === "k") { state.cursor = Math.max(state.cursor - 1, 0); highlightCursor(); }
  if (e.key === "n") gotoNextPending();
  const map = { "1": "ok", "2": "gap", "3": "err", "4": "skip" };
  if (map[e.key]) setVerdict(b.obligations[state.cursor].id, map[e.key]);
});
$("conflict-check").addEventListener("change", () => {
  bstate(state.current).conflict = $("conflict-check").checked; saveDraft(); updatePanel();
});
$("v-approve").addEventListener("click", () => { const st = bstate(state.current); st.verdict = st.verdict === "APPROVE" ? null : "APPROVE"; st.channel = null; saveDraft(); updatePanel(); });
$("v-changes").addEventListener("click", () => { const st = bstate(state.current); st.verdict = st.verdict === "REQUEST_CHANGES" ? null : "REQUEST_CHANGES"; st.channel = null; saveDraft(); updatePanel(); });
$("v-reject").addEventListener("click", () => { const st = bstate(state.current); st.verdict = st.verdict === "REJECT" ? null : "REJECT"; saveDraft(); updatePanel(); });
document.querySelectorAll('input[name=ch]').forEach(r => r.addEventListener("change", () => {
  const st = bstate(state.current); st.channel = r.value; saveDraft(); updatePanel();
}));
$("witness-input").addEventListener("input", (e) => { bstate(state.current).witness = e.target.value; saveDraft(); updatePanel(); });
$("submitbtn").addEventListener("click", () => openRecordModal(true));
$("btn-preview").addEventListener("click", () => openRecordModal(false));
$("btn-bundleinfo").addEventListener("click", openBundleInfo);
$("btn-help").addEventListener("click", openHelp);
$("btn-queue").addEventListener("click", openRail);
$("scrim").addEventListener("click", () => { closeDrawer(); closeRail(); });
$("btn-clear").addEventListener("click", () => {
  delete state.perBundle[state.current];
  saveDraft();
  $("conflict-check").checked = false;
  renderQueue(); renderMain(); updatePanel(); toast("已清空本包草稿");
});
const vp = $("verdictpanel");
function toggleVerdictDrawer(force) {
  const now = vp.dataset.expanded === "true";
  vp.dataset.expanded = String(force !== undefined ? force : !now);
  $("vb-open").textContent = vp.dataset.expanded === "true" ? "收起" : "查看裁决";
}
$("vbar").addEventListener("click", (e) => { if (!e.target.closest("#vb-open")) toggleVerdictDrawer(); });
$("vb-open").addEventListener("click", () => toggleVerdictDrawer());
$("vbar").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleVerdictDrawer(); } });
window.addEventListener("beforeunload", (e) => {
  const st = state.perBundle[state.current];
  if (st && Object.keys(st.verdicts || {}).length && !st.submitted) {
    e.preventDefault(); e.returnValue = "";
  }
});

/* ---------- boot ---------- */
loadDraft();
$("conflict-check").checked = !!bstate(state.current).conflict;
renderQueue(); renderMain(); updatePanel();
</script>
</body>
</html>
