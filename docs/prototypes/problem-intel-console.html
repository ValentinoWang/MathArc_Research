<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问题情报平面控制台</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F7F6; --surface:#FFFFFF; --surface-2:#EDF2F0;
  --ink:#1C2B2D; --muted:#5E7173; --line:#D5DEDC;
  --accent:#0F6B62; --accent-strong:#0A544D; --accent-soft:#E2EFEC;
  --ok:#2E7D4F; --ok-soft:#E3F0E8;
  --gap:#B07818; --gap-soft:#F6EDDA;
  --err:#B3362E; --err-soft:#F6E3E1;
  --skip:#6B7280; --skip-soft:#E9ECEF;
  --hash:#46605D;
  --e1:#DCE7E5; --e2:#A9CBC5; --e3:#6FADA3; --e4:#3A8E80; --e5:#125349;
  --on-e:#EAF4F2; --on-e-dim:#B6D6D0;
  --shadow:0 1px 3px rgba(28,43,45,.08), 0 4px 16px rgba(28,43,45,.06);
  --serif:"STIX Two Text","Noto Serif SC",Georgia,serif;
  --sans:"Noto Sans SC","PingFang SC",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --topbar-h:54px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#10191A; --surface:#172325; --surface-2:#1D2C2E;
    --ink:#E4ECEA; --muted:#93A6A4; --line:#2C3E40;
    --accent:#4FB3A5; --accent-strong:#6FCABB; --accent-soft:#163A36;
    --ok:#62B385; --ok-soft:#17301F;
    --gap:#D9A64A; --gap-soft:#3A2E14;
    --err:#E07A6F; --err-soft:#3D1F1C;
    --skip:#9AA3AD; --skip-soft:#262B31;
    --hash:#8FB4AE;
    --e1:#283533; --e2:#3B5A54; --e3:#4E8177; --e4:#61A697; --e5:#7ECBBB;
    --on-e:#10191A; --on-e-dim:#20423C;
    --shadow:0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#10191A; --surface:#172325; --surface-2:#1D2C2E;
  --ink:#E4ECEA; --muted:#93A6A4; --line:#2C3E40;
  --accent:#4FB3A5; --accent-strong:#6FCABB; --accent-soft:#163A36;
  --ok:#62B385; --ok-soft:#17301F;
  --gap:#D9A64A; --gap-soft:#3A2E14;
  --err:#E07A6F; --err-soft:#3D1F1C;
  --skip:#9AA3AD; --skip-soft:#262B31;
  --hash:#8FB4AE;
  --e1:#283533; --e2:#3B5A54; --e3:#4E8177; --e4:#61A697; --e5:#7ECBBB;
  --on-e:#10191A; --on-e-dim:#20423C;
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);
  font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,p,dl,dd{margin:0;}
ul{margin:0;padding:0;list-style:none;}
button{font:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;}
.note b{color:var(--ink);font-weight:500;}
.lbl{font-size:11px;font-weight:500;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;}
.divider{height:1px;background:var(--line);}
.hash{font-family:var(--mono);font-size:11px;color:var(--hash);}
.stmt{font-family:var(--serif);font-size:15px;line-height:1.75;}
.row{display:flex;align-items:center;gap:8px;}
.col{display:flex;flex-direction:column;gap:8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.spacer{margin-left:auto;}

/* topbar */
.topbar{display:flex;align-items:center;gap:12px;height:var(--topbar-h);padding:0 16px;
  background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;}
.brand{display:flex;align-items:baseline;gap:8px;flex:none;}
.brand .mark{font-family:var(--serif);font-weight:600;font-size:16.5px;color:var(--accent);letter-spacing:.02em;}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.12em;}
.nowtask{min-width:0;flex:1;font-size:13px;color:var(--muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.nowtask b{color:var(--ink);font-weight:500;}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;
  padding:5px 11px;font-size:12.5px;color:var(--muted);white-space:nowrap;flex:none;
  transition:color .12s,border-color .12s,background .12s;}
.btn:hover{color:var(--accent);border-color:var(--accent);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.pri:hover{background:var(--accent-strong);border-color:var(--accent-strong);color:#fff;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn:disabled:hover{color:var(--muted);border-color:var(--line);}
.miniprog{flex:none;font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;
  font-variant-numeric:tabular-nums;}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr) 300px;gap:16px;
  max-width:1520px;margin:0 auto;padding:16px 18px 48px;align-items:start;}
.shell.nosd{grid-template-columns:232px minmax(0,1fr);}
.rail,.side{display:flex;flex-direction:column;gap:12px;position:sticky;top:70px;
  max-height:calc(100vh - 86px);overflow-y:auto;overscroll-behavior:contain;padding-bottom:2px;}
.rail > *,.side > *{flex:none;}
.rail::-webkit-scrollbar,.side::-webkit-scrollbar{width:6px;}
.rail::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.main{display:flex;flex-direction:column;gap:14px;min-width:0;}
@media (max-width:1240px){
  .shell,.shell.nosd{grid-template-columns:200px minmax(0,1fr);}
  .side{grid-column:2;position:static;max-height:none;overflow:visible;}
}
@media (max-width:820px){
  .topbar{height:auto;min-height:var(--topbar-h);padding:7px 10px;gap:7px;flex-wrap:wrap;align-items:center;}
  .brand .sub{display:none;}
  #console-provenance{order:2;min-width:0;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #budget{display:none;}
  .who{order:2;margin-left:auto;padding-left:0;border-left:0;gap:5px;}
  .planes{order:3;flex:1 1 100%;width:100%;overflow-x:auto;}
  .planes button{flex:1;justify-content:center;padding:5px 8px;}
  .nowtask{order:4;flex:1 1 100%;white-space:normal;overflow:visible;}
  .shell,.shell.nosd{grid-template-columns:minmax(0,1fr);}
  .rail{position:static;max-height:none;overflow:visible;} .side{grid-column:1;}
}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}
.card > .body:last-child,.card > .tw:last-child{flex:1;}
.card > header{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);}
.card > header h3{font-size:13px;font-weight:600;}
.card > header .tag{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);}
.card .body{padding:14px;display:flex;flex-direction:column;gap:12px;}
.card .body.tight{padding:6px 14px;}

/* nav：多级折叠目录。
   层级由「缩进 + 一条导轨线」编码；当前所在分支的层级名与导轨线取强调色，
   因此即使祖先被收起，也能看出自己在哪一支下面。 */
.nav{display:flex;flex-direction:column;gap:1px;padding:6px;}
.nav button{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;
  font-size:12.5px;color:var(--muted);background:none;border:0;width:100%;text-align:left;}
.nav button:hover{background:var(--surface-2);color:var(--ink);}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:500;}
.nav button .n{font-family:var(--mono);font-size:10.5px;margin-left:auto;opacity:.8;flex:none;}
.nav .sep{height:1px;background:var(--line);margin:6px 4px;}

/* 目录工具条 */
.nav .navbar{display:flex;align-items:center;gap:8px;padding:1px 5px 6px;}
.nav .navbar .lv{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted);}
.nav .navbar button{width:auto;flex:none;margin-left:auto;padding:3px 9px;font-size:11px;
  border:1px solid var(--line);border-radius:6px;}
.nav .navbar button:hover{color:var(--accent);border-color:var(--accent);background:none;}

/* 分组标题：对象层（主题／问题／攻克目标）显示该层当前选中的对象，
   分类层（信息层／问题层／探索层）只有层级名。 */
.nav button.navgrp{align-items:center;padding:8px 9px;}
.navgrp .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;}
.navgrp .g{font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted);
  display:flex;align-items:center;gap:6px;}
.navgrp .c{font-size:12px;color:var(--ink);line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.navgrp .c.dim{color:var(--muted);}
.navgrp .chev{color:var(--muted);transition:transform .15s;flex:none;}
.navgrp[aria-expanded="false"] .chev{transform:rotate(-90deg);}
.navgrp[aria-expanded="false"] .c{color:var(--muted);}
.navgrp:hover .chev,.navgrp:hover .g{color:var(--accent);}
.navgrp.onpath .g{color:var(--accent);}
/* 收起时，用一个点说明「当前所在的视图就藏在这一支里」 */
.navgrp .hd{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;}

/* 子层容器：每深一级多一条导轨线 */
.navkids{display:flex;flex-direction:column;gap:1px;margin:1px 0 3px 6px;
  padding-left:7px;border-left:1px solid var(--line);}
.navkids.onpath{border-left-color:var(--accent);}
.navkids[hidden]{display:none;}
.nav button.navleaf{padding:6px 9px;font-size:12px;}
.navleaf .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 面包屑：只在路径被收起、树本身说不清位置时出现 */
.railhead .crumb{display:flex;flex-wrap:wrap;align-items:baseline;gap:3px 5px;
  margin-top:8px;padding-top:8px;border-top:1px solid var(--line);
  font-size:10.5px;line-height:1.55;color:var(--muted);}
.railhead .crumb b{display:inline;font-size:9.5px;font-weight:600;letter-spacing:.14em;
  color:var(--muted);opacity:.75;margin-right:2px;}
.railhead .crumb i{font-style:normal;}
.railhead .crumb i.cur{color:var(--accent);font-weight:500;}
.railhead .crumb em{font-style:normal;opacity:.45;}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;
  font-size:11px;font-weight:500;white-space:nowrap;}
.pill.ok{background:var(--ok-soft);color:var(--ok);}
.pill.gap{background:var(--gap-soft);color:var(--gap);}
.pill.err{background:var(--err-soft);color:var(--err);}
.pill.skip{background:var(--skip-soft);color:var(--skip);}
.pill.acc{background:var(--accent-soft);color:var(--accent);}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
.ev{display:inline-block;padding:2px 7px;border-radius:4px;font-family:var(--mono);
  font-size:10.5px;font-weight:500;}
.ev1{background:var(--e1);color:var(--ink);}
.ev2{background:var(--e2);color:#173F39;}
.ev3{background:var(--e3);color:#0B2E29;}
.ev4{background:var(--e4);color:var(--on-e);}
.ev5{background:var(--e5);color:var(--on-e);}

/* table */
.tw{overflow-x:auto;}
table{border-collapse:collapse;width:100%;font-size:12.5px;}
th{font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tr.click{cursor:pointer;}
tr.click:hover td{background:var(--surface-2);}
tr.sel td{background:var(--accent-soft);}
tr.sel:hover td{background:var(--accent-soft);}
td.mut{color:var(--muted);}
.pname{font-family:var(--serif);font-size:13.5px;line-height:1.4;}
.psub{font-size:11px;color:var(--muted);margin-top:2px;}

/* meters */
.meter{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;}
.meter i{display:block;height:100%;background:var(--accent);}
.rangebar{height:26px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden;}
.rangebar i{position:absolute;top:0;height:100%;background:var(--e3);}
.rangebar .tick{position:absolute;top:0;height:100%;display:flex;align-items:center;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:0 7px;}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:12.5px;}
.kv dt{color:var(--muted);white-space:nowrap;}
.stat{display:flex;flex-direction:column;gap:3px;padding:11px 12px;background:var(--surface-2);border-radius:8px;}
.stat b{font-family:var(--mono);font-size:19.5px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;}
.stat span{font-size:11px;color:var(--muted);}

/* banners */
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;
  font-size:12px;line-height:1.6;}
.banner.gap{background:var(--gap-soft);color:var(--gap);border:1px solid var(--gap);}
.banner.err{background:var(--err-soft);color:var(--err);border:1px solid var(--err);}
.banner.acc{background:var(--accent-soft);color:var(--accent-strong);border:1px solid var(--accent);}
.banner.ok{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);}
.banner b{font-weight:600;}

/* gates */
.gates{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;}
.gate{display:flex;flex-direction:column;gap:5px;padding:9px 10px;border-radius:7px;
  background:var(--surface-2);border:1px solid transparent;text-align:left;}
.gate.pass{background:var(--ok-soft);} .gate.pass .g{color:var(--ok);}
.gate.hold{background:var(--gap-soft);border-color:var(--gap);} .gate.hold .g{color:var(--gap);}
.gate.none{background:var(--skip-soft);} .gate.none .g{color:var(--skip);}
.gate.on{outline:2px solid var(--accent);outline-offset:1px;}
.gate .g{font-size:11px;line-height:1.35;}
.gate .m{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;opacity:.75;}
@media (max-width:1100px){.gates{grid-template-columns:repeat(3,minmax(0,1fr));}}

/* knowl */
.knowl{border:0;border-bottom:1px dotted var(--accent);color:var(--accent);background:none;
  padding:0;font:inherit;}
.knowlbody{background:var(--accent-soft);border-left:2px solid var(--accent);padding:11px 14px;
  margin-top:10px;border-radius:0 6px 6px 0;font-size:13.5px;line-height:1.7;}
.stmtbox{padding:16px 18px;background:var(--surface-2);border-radius:9px;border-left:3px solid var(--accent);}

/* segmented */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;}
.seg button{padding:4px 11px;font-size:12px;background:var(--surface);border:0;color:var(--muted);}
.seg button + button{border-left:1px solid var(--line);}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500;}

/* svg diagram */
.dsvg{width:100%;height:auto;display:block;background:var(--surface);}
.nd{cursor:pointer;}
.nd rect{transition:opacity .12s;}
.nd:hover rect{opacity:.85;}
.nd.on rect{stroke:var(--accent);stroke-width:2.5;}
.n-proved{fill:var(--e5);stroke:var(--e5);}
.n-stated{fill:var(--e3);stroke:var(--e3);}
.n-def{fill:var(--e1);stroke:var(--e2);stroke-width:1.4;}
.n-ready{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6;}
.n-cand{fill:var(--gap-soft);stroke:var(--gap);stroke-width:1.6;}
.n-bar{fill:var(--err-soft);stroke:var(--err);stroke-width:1.4;}
.n-open{fill:var(--surface);stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4;}
.tx-d{font-family:var(--sans);font-size:12.5px;fill:var(--ink);}
.tx-l{font-family:var(--sans);font-size:12.5px;fill:var(--on-e);}
.sb-d{font-family:var(--mono);font-size:10px;fill:var(--muted);}
.sb-l{font-family:var(--mono);font-size:10px;fill:var(--on-e-dim);}
.sb-a{font-family:var(--mono);font-size:10px;fill:var(--accent);}
.sb-g{font-family:var(--mono);font-size:10px;fill:var(--gap);}
.sb-e{font-family:var(--mono);font-size:10px;fill:var(--err);}
.edge{stroke:var(--line);stroke-width:1.4;fill:none;}
.edge-alert{stroke:var(--err);stroke-width:1.8;fill:none;stroke-dasharray:5 3;}
.elab{font-family:var(--mono);font-size:10px;fill:var(--muted);}
.elab-e{font-family:var(--mono);font-size:10px;fill:var(--err);}
.lgc{display:flex;flex-direction:column;gap:9px;}
.lgc span{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);}
.lgc i{width:13px;height:13px;border-radius:3px;flex:none;}

/* lists */
.li{display:grid;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.li:last-child{border-bottom:none;}
.li.click{cursor:pointer;margin:0 -14px;padding-left:14px;padding-right:14px;}
.li.click:hover{background:var(--surface-2);}
.li.on{background:var(--accent-soft);}
.li.on:hover{background:var(--accent-soft);}
.funnel{display:flex;border-radius:8px;overflow:hidden;}
.fst{flex:1;padding:12px 14px;display:flex;flex-direction:column;gap:3px;border:0;text-align:left;}
.fst + .fst{border-left:1px solid rgba(255,255,255,.3);}
.fst b{font-family:var(--mono);font-size:21px;font-weight:600;line-height:1;}
.fst span{font-size:11px;} .fst em{font-style:normal;font-size:10.5px;opacity:.82;}
.fst.on{outline:2px solid var(--accent);outline-offset:-2px;}
.q{font-family:var(--mono);font-size:10.5px;color:var(--hash);background:var(--surface-2);
  padding:5px 8px;border-radius:5px;line-height:1.55;}

/* 难度画像：四条各自独立的序数标尺。
   故意不做成雷达图——雷达图会画出一个面积，而这四个维度既不同尺
   （各有各的五级名称），也不可相加，那个面积是凭空造出来的量。
   摊成四条平行标尺，形状照样一眼可读，却不产生任何可被误读为总分的东西。 */
.dprof{display:flex;flex-direction:column;}
.dprof .rw{display:grid;grid-template-columns:1fr max-content;gap:7px 10px;
  padding:12px 14px;border-bottom:1px solid var(--line);align-items:center;}
.dprof .rw:last-child{border-bottom:0;}
.dprof .rw.on{background:var(--accent-soft);}
.dprof .nm{font-size:12.5px;text-align:left;background:none;border:0;padding:0;color:var(--ink);}
.dprof .rw.on .nm{color:var(--accent-strong);font-weight:500;}
.dprof .cur{font-size:11.5px;font-weight:600;background:none;border:0;padding:0;white-space:nowrap;}
.dprof .steps{grid-column:1 / -1;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;}
.dprof .st{height:17px;border-radius:3px;border:1px solid var(--line);
  background:var(--surface-2);padding:0;}
.dprof .st.fill{border-color:transparent;}
.dprof .st.on{outline:2px solid var(--ink);outline-offset:1px;}
.dprof .st:hover{border-color:var(--accent);}
.dprof .rw.on .st{border-color:transparent;}
.dprof .rw.on .st:not(.fill){background:var(--surface);}

/* rubric */
.rub{border:1px solid var(--line);border-radius:9px;overflow:hidden;}
.rub > .h{padding:11px 13px;background:var(--surface-2);display:flex;align-items:center;gap:9px;}
.rub > .h b{font-size:13px;}
.an{display:grid;grid-template-columns:60px 1fr;gap:11px;padding:9px 13px;
  border-top:1px solid var(--line);align-items:flex-start;width:100%;text-align:left;
  background:none;border-left:0;border-right:0;border-bottom:0;}
.an:hover{background:var(--surface-2);}
.an.on{background:var(--accent-soft);}
.an .lv{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding-top:1px;}
.an.on .lv{color:var(--accent);font-weight:600;}
.an .tx{font-size:11.5px;line-height:1.55;color:var(--muted);}
.an.on .tx{color:var(--ink);}
.uc{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  letter-spacing:.08em;padding:2px 7px;border-radius:4px;border:1px solid var(--line);
  background:var(--surface-2);color:var(--muted);}
.uc.bad{border-color:var(--err);color:var(--err);background:var(--err-soft);}
.big{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;}

/* checks */
.chk{display:grid;grid-template-columns:26px 1fr max-content;gap:10px;align-items:flex-start;
  padding:13px 0;border-bottom:1px solid var(--line);}
.chk:last-child{border-bottom:none;}
.box{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;margin-top:1px;flex:none;}
.box.y{background:var(--ok);} .box.n{background:var(--surface-2);border:1.5px solid var(--line);}
.chk .h{font-size:12.5px;font-weight:500;}
.chk .d{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:3px;}
.chk .v{font-family:var(--mono);font-size:11px;color:var(--hash);margin-top:5px;
  background:var(--surface-2);padding:4px 8px;border-radius:5px;display:inline-block;}

/* tiers + checker */
.tier{display:grid;grid-template-columns:118px 1fr max-content;gap:14px;align-items:flex-start;
  padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;}
.tier:last-child{border-bottom:none;}
.tier:hover{background:var(--surface-2);}
.scope{border:1.5px solid var(--accent);border-radius:9px;overflow:hidden;}
.scope > .h{padding:11px 16px;background:var(--accent-soft);display:flex;align-items:center;gap:10px;}
.srow{display:grid;grid-template-columns:130px 1fr max-content;gap:14px;align-items:center;
  padding:11px 16px;border-top:1px solid var(--line);}
.srow .v{font-family:var(--serif);font-size:13.5px;line-height:1.5;}
textarea{width:100%;min-height:84px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-size:13px;
  line-height:1.7;resize:vertical;}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
mark{background:var(--err-soft);color:var(--err);border-radius:3px;padding:0 3px;font-weight:500;}

/* ---- 平面切换 ---- */
.planes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none;}
.planes button{padding:5px 13px;font-size:12.5px;background:var(--surface);border:0;color:var(--muted);
  display:flex;align-items:center;gap:7px;}
.planes button + button{border-left:1px solid var(--line);}
.planes button:hover{color:var(--ink);background:var(--surface-2);}
.planes button.on{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.planes .k{font-family:var(--mono);font-size:10px;opacity:.75;
  width:15px;height:15px;border-radius:50%;display:grid;place-items:center;
  border:1px solid currentColor;flex:none;}
.railhead{padding:11px 14px 9px;border-bottom:1px solid var(--line);}
.railhead b{font-size:12.5px;display:block;}
.railhead span{font-size:11px;color:var(--muted);line-height:1.5;display:block;margin-top:3px;}
.who{display:flex;align-items:center;gap:8px;flex:none;padding-left:4px;border-left:1px solid var(--line);}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;}


/* ---- 硬门进度 ---- */
.gatebar{display:flex;gap:3px;height:30px;border-radius:7px;overflow:hidden;}
.gatebar button{flex:1;border:0;padding:0;position:relative;display:grid;place-items:center;
  font-family:var(--mono);font-size:10.5px;transition:opacity .12s;}
.gatebar button:hover{opacity:.78;}
.gatebar .gp{background:var(--ok);color:#fff;}
.gatebar .gh{background:var(--gap);color:#fff;}
.gatebar .gn{background:var(--surface-2);color:var(--muted);}
.gatebar button.on{outline:2px solid var(--accent);outline-offset:-2px;}
.gatesum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.gatesum b{font-family:var(--mono);font-size:19px;font-weight:600;}
.blocked{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--gap);}

/* ---- 主题说明 ---- */
.topichead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;padding:16px 18px;}
.topichead .tl{min-width:230px;flex:1;}
.topichead h2{font-family:var(--serif);font-size:21px;font-weight:600;}
.topichead .what{font-size:12.5px;color:var(--muted);line-height:1.75;margin-top:7px;max-width:52em;}
.topichead .nums{display:flex;gap:22px;flex:none;}
.topichead .nums div{display:flex;flex-direction:column;gap:2px;}
.topichead .nums b{font-family:var(--mono);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;}
.topichead .nums span{font-size:11px;color:var(--muted);}

/* ---- 主题列表 ----
   五条标准对每个主题是同一套，所以标签只在表头出现一次，单元格按列对齐；
   这样既去掉了逐行重复的小字，也让「哪些主题卡在同一条标准上」可以竖着看出来。
   每行左侧一条状态色条，作为视觉锚点，避免整块读起来是一排平行直线。 */
.topiclist{display:flex;flex-direction:column;}
.topichdr,.topicrow{display:grid;grid-template-columns:3px minmax(0,1fr) 236px;
  gap:0 15px;align-items:start;padding:0 14px;}
.topichdr{padding-top:9px;padding-bottom:8px;border-bottom:1px solid var(--line);}
.topichdr .lgd{grid-column:2;align-self:center;font-size:11px;color:var(--muted);text-align:right;}
.topicrow{padding-top:13px;padding-bottom:13px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .12s;}
.topicrow:last-child{border-bottom:none;}
.topicrow:hover{background:var(--surface-2);}
.topicrow.on{background:var(--accent-soft);}
.topicrow .stripe{align-self:stretch;border-radius:2px;min-height:38px;}
.topicrow .tname{font-family:var(--serif);font-size:15.5px;line-height:1.3;}
.topicrow.off .tname{color:var(--muted);}
.topicrow p{margin-top:5px;max-width:50em;}
.tside{display:flex;flex-direction:column;gap:8px;}
.tcount{font-family:var(--mono);font-size:11px;line-height:1.5;color:var(--muted);
  text-align:right;font-variant-numeric:tabular-nums;}

.critgrid{display:grid;grid-template-columns:repeat(5,1fr) 34px;gap:5px;align-items:center;}
.crithead{font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-align:center;}
/* 满足格用实线描边而不是只靠填色：选中行的底色是 accent-soft，与 ok-soft 几乎同色，
   只填色会让整行格子消失。描边同时让「满足／不满足」除颜色外还有形状差别。 */
.critcell{height:21px;border-radius:5px;display:grid;place-items:center;}
.critcell.y{background:var(--ok-soft);border:1px solid var(--ok);}
.critcell.n{background:var(--surface-2);border:1px dashed var(--line);}
.critcell .k{display:none;font-size:10px;line-height:1;color:var(--muted);}
.critcell.y .k{color:var(--ok);}
.critcell .bar{display:block;width:9px;height:1.5px;border-radius:1px;background:var(--line);}
.critscore{font-family:var(--mono);font-size:12px;font-weight:600;text-align:right;
  font-variant-numeric:tabular-nums;}

/* 提出候选主题的表单 */
.ntform{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;}
.ntform .full{grid-column:1 / -1;}
.ntform label{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;}
.ntform input,.ntform textarea{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:8px;background:var(--surface-2);color:var(--ink);
  font-family:var(--sans);font-size:12.5px;line-height:1.65;}
.ntform textarea{min-height:62px;resize:vertical;}
.ntform input:focus,.ntform textarea:focus{outline:2px solid var(--accent);
  outline-offset:-1px;border-color:var(--accent);}
.ntrow{display:grid;grid-template-columns:17px 1fr max-content;gap:10px;align-items:center;
  width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);font-size:12.5px;color:var(--ink);}
.ntrow + .ntrow{margin-top:6px;}
.ntrow:hover{border-color:var(--accent);}
.ntrow.y{background:var(--ok-soft);border-color:var(--ok);}
.ntrow .bx{width:17px;height:17px;border-radius:5px;display:grid;place-items:center;
  border:1.5px solid var(--line);background:var(--surface-2);}
.ntrow.y .bx{background:var(--ok);border-color:var(--ok);}
.ntrow .stt{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
.ntrow.y .stt{color:var(--ok);}
@media (max-width:820px){.ntform{grid-template-columns:1fr;}}
/* 窄栏放不下并排两列：矩阵移到正文下方占满宽度，表头收起、改由单元格自己带简称，
   仍然不重复完整标准名。
   按容器宽度判断，不按视口：把列表放进分栏后视口没变、栏却窄了一半，
   挂在视口上的断点根本不触发，行会被挤成一条竖着的字。 */
.topiclist{container-type:inline-size;}
@container (max-width:560px){
  .topichdr{display:none;}
  .topicrow{grid-template-columns:3px minmax(0,1fr);}
  .tside{grid-column:2;margin-top:11px;}
  .tcount{text-align:left;}
  .critcell{height:25px;}
  .critcell .mk{display:none;}
  .critcell .k{display:block;}
}

/* ---- 主从面板：两栏等高，各自内部滚动 ----
   一页只该占一屏。列表再长，长的也是列表自己的滚动条，不是整页的。
   因此凡是「一组同级条目 + 每条的详情」，一律左列表右详情，两栏等高；
   凡是「一个整体（矩阵、图、长表）」，不硬凑分栏，只把它自己关进内部滚动。 */
.pane{display:flex;flex-direction:column;max-height:var(--paneh);}
.pane > .scroll,.pane > .tw{overflow:auto;min-height:0;flex:1;}
.pane > .scroll::-webkit-scrollbar,.pane > .tw::-webkit-scrollbar{width:6px;height:6px;}
.pane > .scroll::-webkit-scrollbar-thumb,.pane > .tw::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.pane > .foot{border-top:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
/* pane 内的固定头：作用于本列表的控件跟着列表走，不另占一张卡 */
.pane > .hd{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;
  flex-direction:column;gap:7px;flex:none;}
.pane > .hd .seg{flex-wrap:wrap;}
:root{--paneh:min(660px,calc(100vh - 210px));}
.gridpane{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch;}
/* 主从时左窄右宽：左边只是一列可选项，右边才是要读的内容 */
.gridpane.ld{grid-template-columns:minmax(0,368px) minmax(0,1fr);}
/* 左宽右窄：左边是要读的主体，右边是附属的操作面板 */
.gridpane.dl{grid-template-columns:minmax(0,1fr) minmax(0,392px);}
.gridpane.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
/* 窄栏里的表单一律单列，不靠视口宽度判断——它取决于栏宽，不是屏宽 */
.pane .ntform{grid-template-columns:1fr;}
/* 选中态：整行可点，左侧一条强调色条说明「右边显示的是这一条」 */
.pk{display:grid;gap:10px;width:100%;text-align:left;background:none;border:0;
  border-bottom:1px solid var(--line);padding:11px 14px;position:relative;align-items:start;}
.pk:last-child{border-bottom:0;}
.pk:hover{background:var(--surface-2);}
.pk.on{background:var(--accent-soft);}
.pk.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2.5px;background:var(--accent);}
.pk .t{display:block;font-size:12.5px;line-height:1.5;}
.pk .s{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pk.on .t{color:var(--accent-strong);}
/* 右栏详情：标题 + 若干段，自己滚 */
.dt{display:flex;flex-direction:column;gap:12px;padding:14px;}
.dt > h4{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.45;}
.dt .hash,.dt .kv dd.hash{word-break:break-all;line-height:1.6;}
.dt .kv{grid-template-columns:max-content minmax(0,1fr);}
@media (max-width:1240px){.gridpane.g3{grid-template-columns:1fr 1fr;}}
@media (max-width:1100px){.gridpane.ld{grid-template-columns:minmax(0,300px) minmax(0,1fr);}
  .gridpane.dl{grid-template-columns:minmax(0,1fr) minmax(0,330px);}}
@media (max-width:900px){.gridpane,.gridpane.ld,.gridpane.dl,.gridpane.g3{grid-template-columns:1fr;}
  .pane{max-height:none;} .pane > .scroll,.pane > .tw{overflow:visible;}}

/* ---- 证明过程链 ----
   这一屏的主体是「相邻两条咬合」，所以链必须整条可见：不做左右分栏，也不做弹出框，
   点开的详情就地展开在它自己那一行下面。 */
.chain{display:flex;flex-direction:column;gap:0;}
.chain.plain .cev:not(:last-child)::after{display:none;}
.cev{border:1px solid var(--line);border-radius:8px;margin-bottom:-1px;cursor:pointer;
  background:var(--surface);position:relative;}
.cev:first-child{border-radius:8px 8px 0 0;} .cev:last-child{border-radius:0 0 8px 8px;margin-bottom:0;}
.cev:hover{background:var(--surface-2);}
.cev.open{background:var(--surface-2);border-color:var(--accent);border-radius:8px;
  margin:4px 0;z-index:2;}
.cev.bad{border-color:var(--err);background:var(--err-soft);}
.cev-h{display:flex;align-items:center;gap:10px;padding:9px 12px;}
.cev-h .seq{font-size:11px;color:var(--muted);width:22px;flex:none;font-family:var(--mono);}
.cev-h .seq.bad{color:var(--err);font-weight:600;}
/* 序号错位不体现在哈希芯片上，所以单独标出来：这一行自称的序号 */
.cev-h .sq{font-family:var(--mono);font-size:9.5px;color:var(--err);flex:none;margin-left:-6px;}
.cev-h .who{font-size:12px;color:var(--ink);white-space:nowrap;flex:none;}
.cev-h .subj{font-size:11px;color:var(--muted);min-width:0;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 咬合关系直接画出来：本条的「前」必须等于上一条的「自」。
   不相等时两枚芯片一起变红——断裂是看出来的，不是被红标签告知的。 */
.cev-h .lk{display:inline-flex;align-items:baseline;gap:5px;font-family:var(--mono);font-size:10px;
  padding:2px 7px;border-radius:4px;background:var(--surface-2);color:var(--hash);flex:none;}
.cev-h .lk i{font-style:normal;opacity:.6;font-size:9px;letter-spacing:.06em;}
.cev-h .lk.bad{background:var(--err-soft);color:var(--err);box-shadow:inset 0 0 0 1px var(--err);}
.cev-h .arw{color:var(--muted);font-size:10px;flex:none;opacity:.6;}
.cev-b{padding:2px 12px 13px;display:flex;flex-direction:column;gap:10px;}
/* 四项检查逐条显示，与 EventLedger.validate 的四个分支一一对应 */
.c4{display:flex;flex-wrap:wrap;gap:6px;}
.c4 span{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:4px;
  background:var(--ok-soft);color:var(--ok);}
.c4 span.bad{background:var(--err-soft);color:var(--err);}
/* 相邻事件之间的哈希咬合 */
.cev:not(:last-child)::after{content:"";position:absolute;left:22px;bottom:-5px;width:1px;height:9px;
  background:var(--accent);opacity:.5;}
.cev.bad:not(:last-child)::after{background:var(--err);opacity:1;}
@media (max-width:1000px){.cev-h{flex-wrap:wrap;} .cev-h .subj{flex-basis:100%;order:9;}}

/* ---- 我的 ---- */
.acct{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.usebar{display:flex;flex-direction:column;gap:7px;}
.usebar .t{display:flex;align-items:baseline;gap:8px;font-size:12.5px;}
.usebar .t .v{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--muted);}
.plan{border:1px solid var(--line);border-radius:9px;padding:15px;display:flex;flex-direction:column;gap:9px;text-align:left;background:var(--surface);}
.plan.on{border-color:var(--accent);border-width:1.5px;background:var(--accent-soft);}
.plan .p{font-family:var(--serif);font-size:23px;font-weight:600;}
.plan .u{font-size:11.5px;color:var(--muted);line-height:1.6;}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px;}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;height:100%;}
.bars .b i{display:block;background:var(--e3);border-radius:3px 3px 0 0;min-height:2px;}
.bars .b i.hi{background:var(--accent);}
.bars .b span{font-size:10px;color:var(--muted);text-align:center;font-family:var(--mono);}
@media (max-width:1100px){.acct{grid-template-columns:repeat(2,minmax(0,1fr));}}

/* ---- 落地页 ---- */
#page{display:none;}
.lp{max-width:1080px;margin:0 auto;padding:0 24px 96px;}
.lpnav{display:flex;align-items:center;gap:14px;padding:22px 0;}
.lpnav .links{display:flex;gap:20px;margin-left:auto;font-size:13px;}
.lpnav .links button{background:none;border:0;color:var(--muted);padding:0;}
.lpnav .links button:hover{color:var(--accent);}
.hero{padding:56px 0 40px;}
.hero h1{font-family:var(--serif);font-size:clamp(30px,4.4vw,46px);font-weight:600;line-height:1.28;
  letter-spacing:-.01em;max-width:19em;text-wrap:balance;}
.hero .sub{font-size:16px;color:var(--muted);line-height:1.8;max-width:40em;margin-top:20px;}
.hero .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;align-items:center;}
.bigbtn{padding:11px 20px;border-radius:9px;font-size:14px;font-weight:500;border:1px solid var(--accent);
  background:var(--accent);color:#fff;}
.bigbtn:hover{background:var(--accent-strong);border-color:var(--accent-strong);}
.bigbtn.ghost{background:none;color:var(--accent);}
.bigbtn.ghost:hover{background:var(--accent-soft);color:var(--accent-strong);}
.claimchip{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-family:var(--mono);
  padding:1px 7px;border-radius:4px;vertical-align:middle;margin-left:8px;white-space:nowrap;}
.c-done{background:var(--ok-soft);color:var(--ok);}
.c-proto{background:var(--accent-soft);color:var(--accent);}
.c-plan{background:var(--gap-soft);color:var(--gap);}
.c-no{background:var(--skip-soft);color:var(--skip);}
.honest{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border:1px solid var(--line);
  border-radius:9px;background:var(--surface);margin-top:34px;font-size:12.5px;color:var(--muted);line-height:1.7;}
.sec{padding:52px 0 0;}
.sec > h2{font-family:var(--serif);font-size:24px;font-weight:600;margin-bottom:8px;text-wrap:balance;}
.sec > .lead{font-size:14px;color:var(--muted);line-height:1.8;max-width:44em;margin-bottom:26px;}
.planerow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;}
.planecard{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:20px;
  display:flex;flex-direction:column;gap:11px;text-align:left;}
.planecard:hover{border-color:var(--accent);}
.planecard .k{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.1em;}
.planecard h3{font-family:var(--serif);font-size:18px;font-weight:600;}
.planecard .q{font-size:13px;color:var(--muted);line-height:1.75;background:none;padding:0;font-family:var(--sans);}
.planecard ul{display:flex;flex-direction:column;gap:6px;margin-top:2px;}
.planecard li{font-size:12px;color:var(--muted);padding-left:13px;position:relative;line-height:1.6;}
.planecard li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--e3);}
.steps{display:flex;flex-direction:column;gap:0;}
.step{display:grid;grid-template-columns:44px 1fr;gap:18px;padding:22px 0;border-top:1px solid var(--line);}
.step .no{font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:3px;}
.step h4{font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:7px;}
.step p{font-size:13.5px;color:var(--muted);line-height:1.85;max-width:46em;}
.case{background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden;}
.case .top{padding:20px 22px;border-bottom:1px solid var(--line);}
.case .top h3{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:8px;}
.case .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));}
.case .cell{padding:17px 20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
.case .cell:nth-child(4n){border-right:0;}
.case .cell b{display:block;font-size:12.5px;margin-bottom:5px;}
.case .cell p{font-size:11.5px;color:var(--muted);line-height:1.65;}
.nots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 30px;}
.nots div{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);}
.nots .x{color:var(--err);font-size:15px;font-weight:600;line-height:1.2;}
.nots p{font-size:12.5px;color:var(--muted);line-height:1.7;}
.nots b{color:var(--ink);font-weight:500;display:block;margin-bottom:2px;font-size:13px;}
.lpfoot{margin-top:60px;padding-top:24px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.8;}
@media (max-width:820px){
  .planerow,.case .grid,.nots{grid-template-columns:1fr;}
  .case .cell{border-right:0;}
}

/* ---- 登录 ---- */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;}
.authL{padding:52px 56px;display:flex;flex-direction:column;gap:26px;justify-content:center;
  background:var(--surface-2);border-right:1px solid var(--line);}
.authL h2{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.4;max-width:15em;text-wrap:balance;}
.authL .pt{display:grid;grid-template-columns:20px 1fr;gap:11px;align-items:flex-start;}
.authL .pt i{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:7px;}
.authL .pt p{font-size:13px;color:var(--muted);line-height:1.75;}
.authR{padding:52px 56px;display:flex;flex-direction:column;justify-content:center;align-items:center;}
.authbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;color:var(--muted);}
.field input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);
  color:var(--ink);font-family:var(--sans);font-size:13.5px;}
.field input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);}
.field .hint{font-size:11px;color:var(--muted);}
.field .hint.bad{color:var(--err);}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11.5px;}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line);}
@media (max-width:880px){.auth{grid-template-columns:1fr;} .authL{border-right:0;border-bottom:1px solid var(--line);} .authL{padding:40px 28px;} .authR{padding:36px 28px;}}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:8px;font-size:12.5px;
  box-shadow:var(--shadow);max-width:min(560px,90vw);line-height:1.6;}
</style>
</head>

function treeViews(nodes, out){ out = out || [];

/* ---------------- 目录树 ---------------- */
const saveFold = () => { try{ localStorage.setItem("ma-fold2", JSON.stringify(S.collapsed)); }catch(e){} };
/* 当前视图属于哪棵树。账户页是平铺列表，没有层级，返回 null。 */
function navScope(view){
  if(ADMIN_VIEWS.includes(view)) return { tree:ADMIN_TREE, prefix:"adm", depth:treeDepth(ADMIN_TREE) };
  if(ACCT_VIEWS.includes(view) || FULLPAGE.includes(view)) return null;
  const pl = planeOf(view);
  return { tree:pl.tree, prefix:pl.id, depth:pl.depth };
}
/* 该子树里是否含有某个视图 */
function treeHas(node, view){
  return node.v ? node.v === view : node.kids.some(k => treeHas(k, view));
}
/* 沿路径找到 view，并对它的每一层祖先回调（自内向外） */
function treeWalk(nodes, view, path, hit){
  return nodes.some((n, i) => {
    const p = path ? path + "." + i : String(i);
    if(n.v) return n.v === view;
    if(treeWalk(n.kids, view, p, hit)){ hit(n, p); return true; }
    return false;
  });
}
/* 导航到某个视图时展开它的整条路径，否则目标可能藏在收起的分支里 */
function revealView(view){
  const sc = navScope(view); if(!sc) return;
  treeWalk(sc.tree, view, "", (n, p) => { delete S.collapsed[sc.prefix + ":" + p]; });
  saveFold();
}
function crumbs(view){
  const sc = navScope(view); if(!sc) return [];
  const out = [];
  treeWalk(sc.tree, view, "", n => out.unshift(n.ctx ? n.g + "：" + n.ctx() : n.g));
  if(VMETA[view]) out.push(VMETA[view].n);
  return out;
}
/* 路径上是否有被收起的祖先——只有这时树本身说不清「我在哪」，面包屑才值得占位置 */
function pathHidden(view){
  const sc = navScope(view); if(!sc) return false;
  let hid = false;
  treeWalk(sc.tree, view, "", (n, p) => { if(S.collapsed[sc.prefix + ":" + p]) hid = true; });
  return hid;
}
function groupKeys(tree, prefix){
  const out = [];
  (function walk(nodes, path){
    nodes.forEach((n, i) => {
      if(n.v) return;
      const p = path ? path + "." + i : String(i);
      out.push(prefix + ":" + p); walk(n.kids, p);
    });
  })(tree, "");
  return out;
}
function navTree(nodes, prefix, path){
  return nodes.map((n, i) => {
    const p = path ? path + "." + i : String(i);
    if(n.v){
      const m = VMETA[n.v];
      return `<button class="navleaf${S.view===n.v?" on":""}" data-act="go" data-v="${n.v}">
        <span class="t">${m.n}</span>${m.b?`<span class="n">${m.b()}</span>`:""}</button>`;
    }
    const key = prefix + ":" + p, open = !S.collapsed[key], on = treeHas(n, S.view);
    const dim = n.dim && n.dim();
    return `<button class="navgrp${on?" onpath":""}" data-act="fold" data-k="${key}"
        aria-expanded="${open}" title="${open?"收起":"展开"}「${n.g}」">
        <span class="tx">
          <span class="g">${n.g}${on&&!open?`<span class="hd" title="当前所在"></span>`:""}</span>
          ${n.ctx?`<span class="c${dim?" dim":""}">${n.ctx()}</span>`:""}
        </span>
        <svg class="chev" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M4 6.5 L8 10.5 L12 6.5" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="navkids${on?" onpath":""}"${open?"":" hidden"}>${navTree(n.kids, prefix, p)}</div>`;
  }).join("");
}
/* 目录 + 展开/收起全部 */
function navPanel(tree, prefix, depth){
  const keys = groupKeys(tree, prefix), allOpen = keys.every(k => !S.collapsed[k]);
  return `<div class="navbar"><span class="lv">目录 · ${depth} 级</span>
      <button data-act="foldall" data-v="${allOpen?"1":"0"}">${allOpen?"全部收起":"全部展开"}</button>
    </div>` + navTree(tree, prefix, "");
}

/* 四个维度不相加，但其中几对值得<b>交叉</b>着读——尤其是「人难 vs 机器难」这一对。
   下面是三条写死的读法规则，不是拟合出来的分数：每条都指名它读的是哪个维度、
   为什么这么读。规则可以被反驳，分数不能。 */
function rubRead(){
  const g = id => S.rub[id], out = [];
  out.push(g("intel") <= 1
    ? ["ok","状态可信","问题情报难度低：别名与权威来源都能交叉验证，「今天仍然开放」这句话不容易读错，证书有效期可以给长一些。"]
    : g("intel") >= 3
    ? ["err","状态易过期","问题情报难度高：同名歧义与文献增速会让开放状态迅速失效。这类题的证书有效期必须缩短，复核频率要提上去。"]
    : ["gap","需要人工消歧","多个版本并存，确定「所指是哪一个版本」本身就要花人工——这笔成本发生在攻克开始之前。"]);
  const d = g("math") - g("agent");
  out.push(d >= 2
    ? ["ok","人难、机器不难","数学难度明显高于智能体难度：义务可枚举、反馈密集。这正是本系统相对人类最占便宜的形状——值得优先投入。"]
    : d <= -1
    ? ["err","机器更吃力","智能体难度不低于数学难度：靠散文论证、长上下文或难以自动验证的分析性步骤占比高。这类题对人不算最难，对机器却最难，投入产出比最差。"]
    : ["gap","两侧相当","数学难度与智能体难度接近，没有明显的相对优势。投入与否，主要看验收便不便宜。"]);
  out.push(g("verify") <= 1
    ? ["ok","验收便宜","存在可自动验证的路径，失败能被快速判定——这是允许多轮试错的前提，也是失败不至于白费的原因。"]
    : ["err","验收昂贵","需要专家逐行检查，或缺少合适的独立评审人。即使真做出来，也可能卡在没人能审——这一维度独立否决，补不了。"]);
  return out;
}

          cc.st==="promoted" ? `<b>已升格为待证命题，并附带数值实验证据。</b>该档位不具证明资格，因此这条命题尝试晋升时会被门直接拒绝——这正是设计意图。`
          : cc.st==="refuted" ? `<b>已被数值反驳，但这不等于对应命题被证伪。</b>数值反驳只在探索层生效；要作废一条命题，必须走独立复算的反例通道。`
          : cc.st==="withdrawn" ? `<b>探索会话自行撤回。</b>它发现该猜想与已知障碍冲突，主动放弃，不消耗任何审计资源。`
          : `<b>支持证据太弱，暂不升格。</b>保留为下一轮策略角色的攻击提示。`}</div></div>
      </div></div>`, "pane"))
    + card("为什么猜想不是证据","", `<div class="body">
      <div class="grid3">
        <div class="col" style="gap:6px"><span class="ev ev1">猜想记录</span>
          <p class="note">类型层面就不可能被附着为任何命题的证据。这不是靠约定，是靠类型。</p></div>
        <div class="col" style="gap:6px"><span class="ev ev2">数值实验</span>
          <p class="note">可以作为证据附着，但档位不具证明资格，无法支撑晋升。</p></div>
        <div class="col" style="gap:6px"><span class="ev ev4">精确计算</span>
          <p class="note">具备证明资格。关键命题还需要两组来源独立的证据。</p></div>
      </div>
      <div class="banner acc"><div>三档之间的距离，就是「模型觉得对」与「可以写进论文」之间的距离。</div></div>
    </div>`),
  side: card("被反驳与被撤回","",bd(`
      <p class="note"><b>已被数值反驳</b>的猜想不等于对应命题被证伪：数值反驳只在探索层生效，要作废命题必须走独立复算的反例通道。</p>
      <div class="divider"></div>
      <p class="note"><b>已撤回</b>是探索会话自己发现与已知障碍冲突后主动放弃，不消耗任何审计资源。</p>
      <div class="divider"></div>
      <button class="btn" data-act="go" data-v="routes" style="width:100%">查看路线与证伪</button>`)),
});})();

V.routes = () => noDetail() || (()=>{
  const rr = ROUTES[Math.min(S.rt, ROUTES.length-1)] || ROUTES[0];
  const rst = rr.st==="active" ? ["ok","进行中"] : rr.st==="failed" ? ["err","已失败"] : ["skip","未执行"];
  const rcClaim = CNODES.find(c=>c.id===(rr.claim||"root")) || CNODES[0];
  return ({
  task:`路线与证伪 · <b>${ROUTES.length} 条机制不同的路线</b> · 全部挂在「${rcClaim.t.replace(/^根命题：/,"")}」下`,
  rail: card("为什么要机制不同","",bd(`
      <p class="note">三条都靠同一种技术的路线，本质上只是一条路线。一旦该技术触及障碍，三条同时失效。</p>
      <div class="divider"></div>
      <p class="note">所以路线组合按<b>机制</b>而不是按数量计。当前三条分别是组合枚举、解析不等式与证明助手，彼此不共享失效模式。</p>
      <div class="divider"></div>
      <p class="note">加权论证路线已失败，剩余两条机制仍然独立。</p>`))
    + card("并行还是串行","两条正交的轴",bd(`
      <div><span class="pill acc">并行</span><p class="note" style="margin-top:4px">同一条命题下挂的多条路线。彼此独立攻击同一个目标，晋升门要求<b>全部</b>当前干净。</p></div>
      <div class="divider"></div>
      <div><span class="pill acc">串行</span><p class="note" style="margin-top:4px">命题依赖图里的箭头。一条命题要晋升，它<b>依赖</b>的每条命题必须先各自被证明。</p></div>
      <div class="divider"></div>
      <p class="note">两条路线数量、命题依赖深度都不是画出来凑的——是仓库里两个独立字段各自决定的两件事。下面有完整的例子。</p>`)),
  main: split(
      card("路线",`${ROUTES.length} 条 · 机制互不相同`, `<div class="scroll">
        ${ROUTES.map((r,i)=>{
          const st = r.st==="active" ? ["ok","进行中"] : r.st==="failed" ? ["err","已失败"] : ["skip","未执行"];
          return `<button class="pk${i===S.rt?" on":""}" data-act="rt" data-i="${i}"
            style="grid-template-columns:1fr max-content">
            <span><span class="t">${r.n}</span><span class="s">机制：${r.mech}</span></span>
            <span class="pill ${st[0]}">${st[1]}</span></button>`;}).join("")}
      </div>`, "pane"),
      card(rr.n, rr.mech, `<div class="scroll"><div class="dt">
        <div class="row" style="flex-wrap:wrap;gap:8px">
          <span class="pill acc">${rr.mech}</span>${pill(rst[0],rst[1])}
          <span class="pill skip">${rr.kind}</span></div>
        <div><span class="lbl">证伪测试</span>
          <p class="note" style="color:var(--ink);margin-top:4px">${rr.kill}</p></div>
        <dl class="kv"><dt>测试范围</dt><dd>${rr.scope}</dd>
          <dt>执行结果</dt><dd style="color:${rr.ok===true?"var(--ok)":rr.ok===false?"var(--err)":"var(--muted)"}">${rr.rec}</dd>
          <dt>验证器组</dt><dd>${rr.who}</dd></dl>
        ${rr.why?`<div class="banner gap"><div>${rr.why}</div></div>`:""}
        ${rr.st==="pending"?`<div class="banner err"><div><b>该路线尚未执行证伪测试。</b>只要它仍处于活跃状态且缺少当前的通过记录，根命题的晋升就会被硬阻断——第七轮正是被这条规则拒绝的。</div></div>`:""}
        <p class="note">证伪测试的声明本身带语义摘要：改动测试即改动摘要，旧的通过记录随之失效。</p>
      </div></div>`, "pane"))
    + card("证伪测试是契约，不是建议","", `<div class="body">
      <p class="note">每条结构化路线都必须先声明它的证伪测试：测试什么、范围多大、随机还是确定性、由哪一组验证器执行。声明本身带语义摘要，改动测试即改动摘要，旧的通过记录随之失效。</p>
      <div class="banner err"><div><b>晋升硬阻断：</b>只要有一条活跃的结构化路线缺少当前的通过记录，唯一的晋升入口就会失败关闭。第七轮的晋升尝试正是被这条规则拒绝的——形式化路线至今未执行。</div></div>
      <button class="btn" data-act="go" data-v="dag" data-cn="root" style="align-self:flex-start">查看被阻断的根命题</button>
    </div>`)
    + (()=>{
        const encl = CNODES.find(c=>c.id==="enum"), ineqcl = CNODES.find(c=>c.id==="ineq");
        const flow = (rows) => `<div style="display:flex;align-items:stretch;gap:0;flex-wrap:wrap">
          ${rows.map(([t,sub,b,c],i)=>`${i?`<span style="width:26px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px">→</span>`:""}
          <div style="flex:1;min-width:150px;padding:10px 12px;background:${b};color:${c};border-radius:${i===0?"7px 0 0 7px":i===rows.length-1?"0 7px 7px 0":"0"}">
            <div style="font-size:12px;font-weight:500">${t}</div>${sub?`<div style="font-size:10.5px;opacity:.85;margin-top:2px">${sub}</div>`:""}</div>`).join("")}
        </div>`;
        return card("如果证明路径是「并行里有串行，串行里又有并行」","两条轴叠着走，能表达任意深度", `<div class="body">
          <p class="note">这 ${ROUTES.length} 条路线全部挂在<b>同一条命题</b>——根命题——下面，是<b>并行</b>的：三个机制互不共享失效模式，独立攻击同一个目标。晋升门看的是这个集合的<b>交</b>，不是<b>并</b>——只要有一条仍活跃却缺少当前的通过记录，晋升就整体失败关闭，不管另外几条测得多干净。第七轮正是这样被拒的。</p>
          <div class="q" style="padding:0;background:none">${flow(ROUTES.map(r=>[r.n, r.rec, r.st==="failed"?"var(--err-soft)":r.st==="pending"?"var(--skip-soft)":"var(--ok-soft)", r.st==="failed"?"var(--err)":r.st==="pending"?"var(--muted)":"var(--ok)"]))}</div>
          <p class="note" style="text-align:center">↑ 三条并行 · 同一条命题 · 晋升要求全部当前干净</p>
          <div class="divider"></div>
          <p class="note">根命题还有第二道门，和路线完全无关：它<b>依赖</b>的每条命题必须先各自被证明。这是<b>串行</b>，画在命题依赖图的箭头上，深度可以任意叠。不用编例子，图里现成就有一条：「${encl.t}」依赖「${ineqcl.t}」，而${ineqcl.t}${ineqcl.note.includes("数值实验")?"目前只有数值实验支持，不具证明资格":"尚未闭合"}。所以即使根命题自己这三条路线全部转绿，只要这条串行链没通，根命题照样晋升不了。</p>
          <div class="q" style="padding:0;background:none">${flow([
            [ineqcl.t, ineqcl.st, "var(--e3)", "#0B2E29"],
            [encl.t, encl.st, "var(--accent-soft)", "var(--accent)"],
            [rcClaim.t.replace(/^根命题：/,""), "待证 · 挂着上面 3 条并行路线", "var(--surface-2)", "var(--ink)"],
          ])}</div>
          <p class="note" style="text-align:center">↑ 串行 · 命题依赖命题 · 每一环都可能自己再挂一组并行路线</p>
          <div class="banner acc"><div><b>这两条轴可以叠着走任意多层。</b>串行链上的每一环，自己都可以挂一组并行路线；并行路线服务的那条命题，也可以是另一条串行链的一环。图能画多深，这套模型就能表达多深——因为分解发生在<b>命题</b>这一层，不是发生在路线内部。</div></div>
          <div style="border:1px solid var(--gap);border-radius:9px;overflow:hidden">
            <div style="padding:10px 13px;background:var(--gap-soft)">
              <b style="font-size:12.5px;color:var(--gap)">唯一没做到的：路线内部再拆一棵子路线树</b></div>
            <div class="body tight" style="gap:0">
              <div class="li" style="grid-template-columns:110px 1fr;align-items:center">
                <span class="pill ok">字段存在</span>
                <p class="note"><span class="mono">ResearchRoute.parent_route_id</span> 在 schema 里，写入时校验父路线必须已存在。</p></div>
              <div class="li" style="grid-template-columns:110px 1fr;align-items:center">
                <span class="pill err">无人读取</span>
                <p class="note">没有任何晋升逻辑消费它——路线的父子关系不影响任何门。</p></div>
              <div class="li" style="grid-template-columns:110px 1fr;align-items:center">
                <span class="pill err">无人绘制</span>
                <p class="note">没有任何界面画出这层关系，本页也不画——画了就等于宣称它在起作用。</p></div>
            </div>
            <div style="padding:11px 13px;border-top:1px solid var(--line)">
              <span class="lbl">真实做法</span>
              <p class="note" style="margin-top:4px">一条路线的机制需要再拆时，拆成一条<b>新命题</b>并带上依赖边。分解永远发生在命题图那一层，路线本身不再往下分。</p></div>
          </div>
          <div class="row"><button class="btn" data-act="go" data-v="dag" data-cn="enum">看「${encl.t}」在依赖图里的位置</button>
            <button class="btn" data-act="go" data-v="dag" data-cn="ineq">看挡住它的「${ineqcl.t}」</button></div>
        </div>`);
      })(),
  side: card("三条失败通道","再次强调，不可混同",bd(`
      <div>${pill("skip","评审缺口")}<p class="note" style="margin-top:4px">不改变任何数学状态。</p></div><div class="divider"></div>
      <div>${pill("gap","路线失败")}<p class="note" style="margin-top:4px">只改变该条路线。加权论证路线失败了，但它试图证明的命题仍然待证。</p></div><div class="divider"></div>
      <div>${pill("err","命题反例")}<p class="note" style="margin-top:4px">唯一能证伪命题的通道，必须经独立复算。</p></div>`)),
});})();

V.tools = () => noDetail() || ({
  task:`工具调用台账 · <b>${TOOLS.length} 条调用记录</b> · ${TOOLS.filter(t=>t.replayable).length} 条可冷重放`,
  rail: card("白名单是封闭的","条数由注册表决定",bd(`
      <p class="note">工作者只能调用白名单内的模板，不能自行引入新工具、访问网络或写入依赖图。</p>
      <div class="divider"></div>
      <p class="note">当前注册表恰好是 ${NEXACT} 个模板，但 ${NEXACT} 不是设计常数——<span class="mono">default_exact_tool_registry()</span> 注册了几个就是几个。</p>
      <div class="col" style="gap:4px;margin-top:2px">
        ${TOOLS.filter(t=>t.chan==="exact").map(t=>`<span class="hash">· ${t.tid}</span>`).join("")}
      </div>
      <div class="divider"></div>
      <p class="note"><b>「有限枚举」不在这份名单里。</b>它是证伪通道的一种 <span class="mono">KillTestKind</span>，只产出反例。把它算进白名单，会让白名单看起来比实际大一格，也会模糊「能证成」与「只能否证」的界线。</p>`))
    + card("台账记的是什么","照搬 ToolCallRecord",bd(`
      <p class="note">这不是一张「跑了哪些工具」的汇总表。<span class="mono">ToolCallRecord</span> 要求每次调用都带上：预先声明的成功判据、输入与输出的内容摘要、环境摘要、独立性分组、以及一条可以照着重跑的命令。</p>
      <div class="divider"></div>
      <p class="note"><b>可冷重放不是一个人写上去的标志位。</b>后端把它写成一个 property：<span class="mono">replay_command</span>、输入摘要、输出摘要、环境摘要<b>四样齐全</b>才为真，缺一即假。这一屏照同样的方式算。</p>`)),
  main: card("工具调用台账",`${NEXACT} 条来自白名单 + 1 条来自证伪通道 · 点开看完整记录`, `<div class="body">
      ${REPLAY_WARN.length?`<div class="banner gap"><div><b>导出时会带 ${REPLAY_WARN.length} 条告警：状态为 PASS，却不可冷重放。</b>
        <span class="mono">${REPLAY_WARN.map(t=>t.cid).join("、")}</span> 缺少环境摘要，因此 <span class="mono">replayable</span> 为假。
        <span class="mono">trace.py</span> 对这种组合会记一条 <span class="mono">tool call ... is not cold-replayable</span>——一次通过了但复现不了的调用，不该被当成通过了就完事。</div></div>`:""}
      <div class="chain plain">${TOOLS.map((t,i)=>{
        const st = TSTATUS[t.st], open = S.tool===i;
        const ck = [["重放命令",t.replay],["输入摘要",t.inD],["输出摘要",t.outD],["环境摘要",t.envD]];
        return `<div class="cev${open?" open":""}${t.st==="ERROR"||t.st==="FAIL"?" bad":""}" data-act="tool" data-i="${i}"
            tabindex="0" role="button" aria-expanded="${open}" aria-label="${t.n} · ${st[1]}">
          <div class="cev-h">
            <span class="mono seq" style="width:auto">${t.cid}</span>
            <span class="pill ${st[0]}">${st[1]}</span>
            <span class="who">${t.n}</span>
            <span class="subj">${t.purpose}</span>
            <span class="hash" style="flex:none">${CHANLBL[t.chan]}</span>
            <span class="mono" style="flex:none;font-size:10.5px;color:var(--muted)">${t.ms>=1000?(t.ms/1000).toFixed(1)+" 秒":t.ms+" 毫秒"}</span>
            <span class="pill ${t.replayable?"ok":(t.st==="PASS"?"err":"skip")}" style="flex:none"
              title="${t.st==="PASS"?"通过的调用必须可冷重放":"未产出证据的调用不适用这项要求"}">${
              t.replayable?"可冷重放":(t.st==="PASS"?"不可冷重放":"不适用")}</span>
          </div>
          ${open?`<div class="cev-b">
            <div><span class="lbl">预先声明的成功判据 · expected_discriminator</span>
              <div class="q" style="margin-top:5px">${t.disc}</div>
              <p class="note" style="margin-top:4px">判据在调用<b>之前</b>写死。事后再解释「这个结果算不算成功」，那是把结论倒推成判据。</p></div>
            <div><span class="lbl">可冷重放 · 四样齐全才为真</span>
              <div class="c4" style="margin-top:6px">${ck.map(([k,v])=>`<span class="${v?"":"bad"}">${k}${v?"":" 缺失"}</span>`).join("")}</div>
              ${t.st!=="PASS"?`<p class="note" style="margin-top:5px">这一条没有通过，也就没有产出任何证据，因此 <span class="mono">replayable</span> 为假不构成问题——后端只对 <span class="mono">status is PASS</span> 的调用检查这一项。</p>`:""}</div>
            ${t.st==="PASS"&&!t.replayable?`<div class="banner gap"><div><b>状态是 PASS，但 replayable 为假。</b>导出时 <span class="mono">trace.py</span> 会为这一条记一条告警；如果它支撑的是关键命题，晋升门会直接拒绝。</div></div>`:""}
            ${t.st==="ERROR"?`<div class="banner gap"><div><b>ToolStatus.ERROR：求解器答不出来，不构成任何方向的结论。</b>「不知道」永远不能被读成「成立」，因此这一条没有输出摘要，也不产生任何证据。</div></div>`:""}
            ${t.st==="FAIL"?`<div class="banner err"><div><b>ToolStatus.FAIL：证伪测试没通过，也就是找到了反例。</b>它通过工具调用通道报告，绝不作为命题的支持证据——反例只走负向通道。</div></div>`:""}
            <dl class="kv">
              <dt>调用编号</dt><dd class="hash">${t.cid}</dd>
              <dt>工具标识</dt><dd class="hash">${t.tid}</dd>
              <dt>调用目的</dt><dd>${t.purpose}</dd>
              <dt>状态</dt><dd><span class="pill ${st[0]}">${st[1]}</span> <span class="hash">${t.st}</span></dd>
              ${t.exit!==undefined?`<dt>退出码</dt><dd class="mono">${t.exit===null?"null（未正常结束）":t.exit}</dd>`:""}
              <dt>独立性分组</dt><dd class="hash">${t.grp}</dd>
              <dt>输入摘要</dt><dd class="hash">${t.inD||"—"}</dd>
              <dt>输出摘要</dt><dd class="hash">${t.outD||"—（本次调用没有输出）"}</dd>
              <dt>环境摘要</dt><dd class="hash" style="color:${t.envD?"":"var(--err)"}">${t.envD||"—（缺失）"}</dd>
              <dt>重放命令</dt><dd class="hash">${t.replay}</dd>
              <dt>信任档位</dt><dd>${t.trust}</dd></dl>
            <p class="note">字段对应 <span class="mono">ToolCallRecord</span> 的 <span class="mono">call_id / tool / purpose / status / independence_group / input_digest_sha256 / output_digest_sha256 / environment_digest_sha256 / replay_command</span>，上面只是把它们译成了看得懂的标签。</p>
            <p class="note">${t.sem}</p>
          </div>`:""}
        </div>`;}).join("")}</div>

function billing(){
  const cny = USE.reduce((a,u)=>a+u[1],0);
  const rows = MODELS.map(m=>{ const usd = m.inTok*m.inP + m.outTok*m.outP; return {...m, usd, cny: usd*RATE}; });
  const modelCny = rows.reduce((a,r)=>a+r.cny,0);
  const nonTotal = cny - modelCny;
  const non = NONMODEL.map(x=>({...x, cny: nonTotal*x.w/100}));
  const pts = Math.round(cny*PT);
  return { cny, rows, modelCny, nonTotal, non, pts,
    leftPt: QUOTA_PT - pts, pct: Math.round(pts/QUOTA_PT*100),
    maxCny: Math.max(...rows.map(r=>r.cny), ...non.map(n=>n.cny)) };
}

/* orchestrator.py 的 MAX_NEW_CLAIMS_PER_PROPOSAL / MAX_NEW_ROUTES_PER_PROPOSAL。
   这是一次提案能做的全部扩张——仓库里没有任何 spawn / 子会话派生通道。 */
const MAXNEW = { claims:5, routes:5 };
/* 停止原因来自 matharc/v02/campaign.py 的四个 stop_reason 分支；
   括号里的默认值是同文件构造器的默认参数（max_rounds=20、max_rounds_without_gain=5）。
   阈值可配，但分支就是这四条。 */
const STOPS = [
  { n:"预算耗尽", id:"budget_exhausted", k:"gap", def:"由预算台账决定",
    d:"墙钟、积分或调用次数任一触顶，当前轮次结束即停，不降级继续跑。" },
  { n:"连续无语义增益", id:"no_gain_rounds_exhausted", k:"gap", def:"max_rounds_without_gain = 5",
    d:"连续 N 轮没有新增可采信证据、状态改变、路线排除或障碍确认。" },
  { n:"轮数上限", id:"max_rounds_reached", k:"skip", def:"max_rounds = 20",
    d:"轮数跑满即停。它不代表闭合，也不代表无增益——只代表配额用完。" },
  { n:"目标闭合", id:"release_state_terminal", k:"ok", def:"发布状态进入终态",
    d:"根命题通过晋升门，发布状态到达终态，攻克进程正常结束。" },
];

/* SHA-256：这一页的全部说服力在于哈希可被读者自行复算，因此用真算法，不用占位 */
const sha256 = (() => {
  const K = new Uint32Array(64), H0 = new Uint32Array(8);
  const isPrime = x => { for (let d = 2; d * d <= x; d++) if (x % d === 0) return false; return true; };
  for (let c = 2, i = 0, j = 0; i < 64; c++) {
    if (!isPrime(c)) continue;
    if (j < 8) H0[j++] = ((Math.cbrt(c) * 0 + Math.sqrt(c)) % 1) * 4294967296 >>> 0;
    K[i++] = (Math.cbrt(c) % 1) * 4294967296 >>> 0;
  }
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  return function (str) {
    const bytes = new TextEncoder().encode(str);
    const bitLen = bytes.length * 8;
    const withPad = new Uint8Array((((bytes.length + 9) >> 6) + 1) << 6);
    withPad.set(bytes); withPad[bytes.length] = 0x80;
    new DataView(withPad.buffer).setUint32(withPad.length - 4, bitLen >>> 0);
    new DataView(withPad.buffer).setUint32(withPad.length - 8, Math.floor(bitLen / 4294967296));
    const H = H0.slice(), w = new Uint32Array(64), dv = new DataView(withPad.buffer);
    for (let off = 0; off < withPad.length; off += 64) {
      for (let t = 0; t < 16; t++) w[t] = dv.getUint32(off + t * 4);
      for (let t = 16; t < 64; t++) {
        const s0 = rr(w[t-15],7) ^ rr(w[t-15],18) ^ (w[t-15] >>> 3);
        const s1 = rr(w[t-2],17) ^ rr(w[t-2],19) ^ (w[t-2] >>> 10);
        w[t] = (w[t-16] + s0 + w[t-7] + s1) >>> 0;
      }
      let [a,b,c,d,e,f,g,h] = H;
      for (let t = 0; t < 64; t++) {
        const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[t] + w[t]) >>> 0;
        const S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
        const mj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + mj) >>> 0;
        h=g; g=f; f=e; e=(d+t1)>>>0; d=c; c=b; b=a; a=(t1+t2)>>>0;
      }
      const v=[a,b,c,d,e,f,g,h];
      for (let t=0;t<8;t++) H[t] = (H[t] + v[t]) >>> 0;
    }
    return Array.from(H, x => x.toString(16).padStart(8,"0")).join("");
  };
})();

}

   payload = { details:{…}, state_digest_after:<工作区状态摘要> }。
   状态摘要不是编的——下面真的按事件类型维护一份工作区状态并对它取哈希，
   所以读者自己复算也能得到同一个值。 */
const ST0 = { claims:[], routes:[], sources:[], evidence:0, tool_calls:0, failures:0, promoted:[] };
function applyEvent(st, type, sub){
  const n = { claims:[...st.claims], routes:[...st.routes], sources:[...st.sources],
    evidence:st.evidence, tool_calls:st.tool_calls, failures:st.failures, promoted:[...st.promoted] };
  const c = sub[0], r = sub[1];
  if(type==="CLAIM_ADDED" && c) n.claims.push(c);
  else if(type==="ROUTE_ADDED" && r) n.routes.push(r);
  else if(type==="SOURCE_CLAIM_ADDED" && c) n.sources.push(c);
  else if(type==="EVIDENCE_ADDED") n.evidence++;
  else if(type==="TOOL_CALL_ADDED") n.tool_calls++;
  else if(type==="FAILURE_RECORDED") n.failures++;
  else if(type==="CLAIM_PROMOTED" && c) n.promoted.push(c);
  return n;
}
/* 事件编号照搬后端格式 EV-{6 位序号}-{10 位十六进制}；后缀由内容派生，
   因此每次加载都一样，读者复算出的哈希才可比对。 */
const EVENTS = (() => { let st = ST0;
  return RAW.map(([t,a,sub,det,rd],i)=>{ st = applyEvent(st, t, sub);
    return { sequence:i, round:rd,
      event_id:"EV-"+String(i).padStart(6,"0")+"-"+sha256(canon([i,t,sub])).slice(0,10),
      event_type:t, actor:a, subject_ids:sub,
      payload:{ details:det, state_digest_after: sha256(canon(st)) },
      timestamp:"2026-08-3"+(i<10?"0":"1")+"T0"+(i%9)+":"+String(10+i*3).padStart(2,"0")+":00Z" };

/* 参与哈希的字段与顺序照搬 ResearchEvent.unsigned_dict */
function eventJSON(it, prev){
  return { sequence:it.seq, event_id:it.id, event_type:it.type, actor:it.actor,
    subject_ids:it.subjects, payload:it.payload, previous_hash:prev, timestamp:it.ts };
}
const BASE = EVENTS.map(e=>({ seq:e.sequence, id:e.event_id, type:e.event_type,

   五种改法的错误签名各不相同，这正是这一屏值得看的地方。 */
const TAMPERS = [
  { m:"edit",    n:"改动载荷", d:"改掉第 7 条的载荷，但不动它声明的两个哈希。" },
  { m:"delete",  n:"删除一条", d:"把第 7 条整条抽走，其余原样保留。" },
  { m:"swap",    n:"对调顺序", d:"把第 7、8 两条的位置对调。" },
  { m:"insert",  n:"插入一条", d:"在第 7 条后塞进一条伪造事件，沿用它的编号。" },
  { m:"rewrite", n:"整链重写", d:"改掉第 7 条，并把其后每一条的前哈希与事件哈希全部重算。" },
];
const TIDX = 7;
function presented(){
  const base = BASE.map((it,i)=>({ ...it, prevDecl:SEALED[i].prev, hashDecl:SEALED[i].hash, mark:"" }));
  const t = S.tamper; if(!t) return base;
  const i = TIDX;
  const edited = x => ({ ...x, payload:{ ...x.payload,
    details:{ ...x.payload.details, "被改动":"演示：这一字段是封存之后加上的" } } });
  const a = base.slice();
  if(t === "edit"){ a[i] = { ...edited(a[i]), mark:"改动" }; return a; }
  if(t === "delete"){ a.splice(i,1); if(a[i]) a[i] = { ...a[i], mark:"断口" }; return a; }
  if(t === "swap"){ const x = a[i]; a[i] = { ...a[i+1], mark:"对调" }; a[i+1] = { ...x, mark:"对调" }; return a; }
  if(t === "insert"){ a.splice(i+1, 0, { ...edited(base[i]), mark:"伪造" }); return a; }
  if(t === "rewrite"){
    a[i] = { ...edited(a[i]), mark:"改动" };
    let prev = a[i].prevDecl;
    for(let k=i;k<a.length;k++){
      const h = sha256(canon(eventJSON(a[k], prev)));
      a[k] = { ...a[k], prevDecl:prev, hashDecl:h, mark:k===i?"改动":"重写" };
      prev = h;
    }
    return a;
  }

}
/* 逐条复算完全照搬 EventLedger.validate 的四项检查，包括一个关键细节：
   previous 按事件「自己声明的」event_hash 前进（后端就是 previous = event.event_hash），
   而不是按复算值前进。差别很实在——按复算值前进会让一次改动看起来级联失配十几条，
   而后端实际只会报出一条。把这一点做对，才谈得上「照搬」。 */
function verifyChain(){
  const items = presented(), rows = [], errors = [], seen = new Set();
  let previous = GENESIS;
  items.forEach((it, idx) => {
    const seqOk  = it.seq === idx;
    const prevOk = it.prevDecl === previous;
    const recomputed = sha256(canon(eventJSON(it, it.prevDecl)));
    const hashOk = it.hashDecl === recomputed;
    const idOk   = !seen.has(it.id); seen.add(it.id);
    if(!seqOk)  errors.push(`${it.id}：序号 ${it.seq} ≠ ${idx}`);
    if(!prevOk) errors.push(`${it.id}：前哈希与上一条声明的事件哈希不一致`);
    if(!hashOk) errors.push(`${it.id}：事件哈希与载荷对不上`);
    if(!idOk)   errors.push(`重复的事件编号：${it.id}`);
    rows.push({ ...it, idx, seqOk, prevOk, hashOk, idOk, recomputed, expect:previous,
      ok: seqOk && prevOk && hashOk && idOk });
    previous = it.hashDecl;
  });
  return { rows, errors, valid: !errors.length, head: previous,
    headMatch: previous === HEAD_PUB, count: items.length };
}

const FULLPAGE = ["landing","login"];
function render(){
  const chrome = $("#chrome"), page = $("#page");
  if(FULLPAGE.includes(S.view)){
    chrome.style.display = "none"; page.style.display = "block";
    page.innerHTML = (V[S.view])().page;
    syncThemeBtn();
    try{ localStorage.setItem("ma-view", S.view); }catch(e){}
    return;
  }
  chrome.style.display = "block"; page.style.display = "none"; page.innerHTML = "";
  const v = (V[S.view] || V.portfolio)();
  const pl = PLANES.find(p=>p.id===S.plane) || PLANES[0];

  const admin = ADMIN_VIEWS.includes(S.view);

    ? `<span class="crumb"><b>位置</b>${path.map((c,i) =>
        `<i${i===path.length-1?' class="cur"':''}>${c}</i>`).join('<em>›</em>')}</span>`
    : "";
  $("#railhead").innerHTML = admin
    ? `<b>管理端</b><span>治理与运营</span>` + crumbHtml
    : acct ? `<b>账户</b><span>积分、充值与预算上限</span>`
    : `<b>${pl.full}</b><span>${pl.q}</span>` + crumbHtml;
  $("#nav").innerHTML = admin
    ? navPanel(ADMIN_TREE, "adm", treeDepth(ADMIN_TREE))
      + `<div class="sep"></div><button data-act="go" data-v="acct_overview">← 返回个人账户</button>`
      + `<button data-act="plane" data-v="${pl.id}">← 返回${pl.n}</button>`
    : acct
    ? ACCT_VIEWS.map(id=>`<button class="${S.view===id?"on":""}" data-act="go" data-v="${id}">${VMETA[id].n}</button>`).join("")
      + (S.role==="admin" ? `<div class="sep"></div><button data-act="go" data-v="admin_roles">管理端</button>` : "")
      + `<div class="sep"></div><button data-act="role">${S.role==="admin"?"切回个人身份":"切换到管理员身份"}</button>`
      + `<button data-act="plane" data-v="${pl.id}">← 返回${pl.n}</button>`
    : navPanel(pl.tree, pl.id, pl.depth)
      + `<div class="sep"></div><button data-act="go" data-v="acct_overview">我的</button>`;
  $("#nowtask").innerHTML = v.task;
  $("#budget").textContent = S.guest ? "访客只读模式" : "预算 41% · 剩余 1 060 秒";
  $("#avatar").textContent = S.guest ? "客" : (S.role==="admin" ? "管" : "研");
  $("#railcard").innerHTML = v.rail;
  $("#main").innerHTML = v.main;
  $("#side").innerHTML = v.side || "";
  $("#shell").className = "shell" + (v.side ? "" : " nosd");
  syncThemeBtn();
  try{ localStorage.setItem("ma-view", S.view); }catch(e){}
}

document.addEventListener("click", e => {
  if(e.target.id === "themebtn" || e.target.id === "themebtn2"){ toggleTheme(); return; }
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const a = el.dataset.act, wasView = S.view;
  if(a==="go"){ S.view = el.dataset.v; S.gate = null;
    if(!ACCT_VIEWS.includes(S.view) && !ADMIN_VIEWS.includes(S.view) && !FULLPAGE.includes(S.view)) S.plane = planeOf(S.view).id;
    if(el.dataset.cn) S.cnode = el.dataset.cn;
    window.scrollTo({top:0}); }
  else if(a==="plane"){ const p = PLANES.find(x=>x.id===el.dataset.v); S.plane = p.id; S.view = p.views[0]; window.scrollTo({top:0}); }
  else if(a==="enter"){ const p = PLANES.find(x=>x.id===el.dataset.v); S.guest = true; S.plane = p.id; S.view = p.views[0]; window.scrollTo({top:0}); }
  else if(a==="demo"){ S.guest = true; S.plane = "p"; S.view = "portfolio"; window.scrollTo({top:0});
    toast("已进入访客只读模式。界面中的问题、参数与概率均为演示数据，不代表任何问题的真实状态。"); }
  else if(a==="scroll"){ const t = document.getElementById("sec-"+el.dataset.v);
    if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  else if(a==="signin"){
    const mail = ($("#f-mail")||{}).value || "", code = ($("#f-code")||{}).value || "";
    const okMail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail);
    const hm = $("#h-mail"), hc = $("#h-code");
    if(hm){ hm.className = "hint" + (okMail || !mail ? "" : " bad");

const LIVE_VIEW_CONTRACTS = {
  source:["source_registry_projection","live"], dag:["verification_publication","live"],
  proofchain:["verification_publication","live"], tools:["verification_publication","live"],
  reasoning:["verification_publication","live"], admin_roles:["verification_publication","live"],
  campaign:["campaign_observatory","live_if_campaign_report_supplied"]

const livePayloadFor = view => {
  const payload = S.consolePayload, contract = LIVE_VIEW_CONTRACTS[view];

};

const liveEsc = value => esc(value == null ? "—" : String(value));
const safeExternalHref = value => {
  try {
    const parsed = new URL(String(value));
    return /^(https?):$/.test(parsed.protocol) ? parsed.href : null;
  } catch (_) { return null; }
};
const livePill = value => {
  const text = liveEsc(value), raw = String(value || "");
  const kind = /^(PROVED|VERIFIED|PASS|ACCEPTED|ACTIVE)$/.test(raw) ? "ok"
    : /^(REFUTED|REJECTED|FAIL|ERROR|RETRACTED)$/.test(raw) ? "err"
    : /^(BLOCKED|PENDING|CANDIDATE|OPEN|PROPOSED|RUNNING)$/.test(raw) ? "gap" : "skip";
  return `<span class="pill ${kind}">${text}</span>`;
};
const liveChain = events => {
  const genesis = "0".repeat(64);
  let previous = genesis, valid = true;
  const eventIds = new Set();
  const rows = events.map((event, index) => {
    const unsigned = { sequence:event.sequence, event_id:event.event_id, event_type:event.event_type,
      actor:event.actor, subject_ids:event.subject_ids, payload:event.payload,
      previous_hash:event.previous_hash, timestamp:event.timestamp };
    const sequenceOk = event.sequence === index;
    const previousOk = event.previous_hash === previous;
    let canonicalOk = false;
    try {
      canonicalOk = typeof event.canonical_unsigned_json === "string"
        && canon(JSON.parse(event.canonical_unsigned_json)) === canon(unsigned);
    } catch (_) { canonicalOk = false; }
    const hashOk = canonicalOk && event.event_hash === sha256(event.canonical_unsigned_json);
    const eventIdOk = typeof event.event_id === "string" && event.event_id.length > 0 && !eventIds.has(event.event_id);
    eventIds.add(event.event_id);
    const rowOk = sequenceOk && previousOk && hashOk && eventIdOk;
    valid = valid && rowOk;
    previous = event.event_hash;
    return { event, sequenceOk, previousOk, hashOk, eventIdOk, rowOk };
  });
  return { rows, valid, head:previous, genesis };
};
