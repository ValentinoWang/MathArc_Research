  return { task:`证明过程链 · <b>真实事件账本</b> · ${(workspace.events.events||[]).length} 条`,
    rail: liveCard("浏览器复算","与 EventLedger 相同的无符号字段", `<p class="note">每条事件在浏览器内重算 SHA-256，并检查顺序、前哈希和声明哈希。此页的复算用于现场核验，不替代后端审计。</p>`),
    main: liveCard("账本核验",`${chain.valid && chain.head===declaredHead ? "链完整" : "链不一致"}`, `<div class="banner ${chain.valid && chain.head===declaredHead ? "ok" : "err"}"><div><b>${chain.valid && chain.head===declaredHead ? "全部事件通过本地复算。" : "本地复算与声明链头不一致。"}</b> 声明链头：<span class="hash">${liveEsc(declaredHead)}</span></div></div><div class="tw"><table><thead><tr><th>#</th><th>事件</th><th>执行者</th><th>对象</th><th>顺序</th><th>咬合</th><th>哈希</th></tr></thead><tbody>${chain.rows.map(row=>`<tr><td>${row.event.sequence}</td><td class="mono">${liveEsc(row.event.event_type)}</td><td>${liveEsc(row.event.actor)}</td><td class="mono">${(row.event.subject_ids||[]).map(liveEsc).join(" · ") || "—"}</td><td>${livePill(row.sequenceOk ? "VERIFIED" : "ERROR")}</td><td>${livePill(row.previousOk ? "VERIFIED" : "ERROR")}</td><td>${livePill(row.hashOk ? "VERIFIED" : "ERROR")}</td></tr>`).join("") || `<tr><td colspan="7" class="mut">账本为空。</td></tr>`}</tbody></table></div>`),
    side: liveCard("链头","外部可钉定的摘要", `<dl class="kv"><dt>创世前哈希</dt><dd class="hash">${liveEsc(chain.genesis)}</dd><dt>复算链头</dt><dd class="hash">${liveEsc(chain.head)}</dd><dt>事件数</dt><dd>${chain.rows.length}</dd></dl>`)};
};

V.tools = () => {
  const workspace = liveWorkspace("tools"); if(!workspace) return DEMO_VIEWS.tools();
  const tools = workspace.trace.tool_calls || [];
  const replayable = tools.filter(item=>item.replay_command && item.input_digest_sha256 && item.output_digest_sha256 && item.environment_digest_sha256).length;
  return { task:`工具调用台账 · <b>真实记录</b> · ${tools.length} 次调用`,
    rail: liveCard("冷重放","四字段同时存在才成立", `<p class="note">页面只根据记录中的命令、输入摘要、输出摘要和环境摘要计算可重放性；不会把成功状态误读为可重放。</p>`),
    main: liveCard("工具调用",`${replayable} / ${tools.length} 条可冷重放`, `<div class="tw"><table><thead><tr><th>调用</th><th>工具 / 用途</th><th>状态</th><th>命题</th><th>独立组</th><th>可重放</th></tr></thead><tbody>${tools.map(item=>{ const ok=!!(item.replay_command&&item.input_digest_sha256&&item.output_digest_sha256&&item.environment_digest_sha256); return `<tr><td class="mono">${liveEsc(item.call_id)}</td><td><b>${liveEsc(item.tool)}</b><br><span class="mut">${liveEsc(item.purpose)}</span></td><td>${livePill(item.status)}</td><td class="mono">${(item.linked_claim_ids||[]).map(liveEsc).join(" · ")||"—"}</td><td class="mono">${liveEsc(item.independence_group)}</td><td>${livePill(ok?"VERIFIED":"PENDING")}</td></tr>`; }).join("") || `<tr><td colspan="6" class="mut">没有工具调用记录。</td></tr>`}</tbody></table></div>`),
    side: liveCard("导出边界","只读", `<p class="note">工具调用由受治理运行时记录。控制台不执行工具、不创建证据，也不改变命题状态。</p>`)};
};

V.reasoning = () => {
  const workspace = liveWorkspace("reasoning"); if(!workspace) return DEMO_VIEWS.reasoning();
  const reasoning = workspace.trace.public_reasoning || [];
  return { task:`公开推理 · <b>真实结构化记录</b> · ${reasoning.length} 条`,
    rail: liveCard("公开字段","不含私有思维链", `<p class="note">导出只包含目标、前提、动作、观察、证伪测试和决定等可审计字段。不存在的字段不由前端补造。</p>`),
    main: liveCard("结构化推理",`${reasoning.length} 条`, `<div class="chain plain">${reasoning.map(item=>`<div class="cev open"><div class="cev-h"><span class="pill acc">${liveEsc(item.role)}</span><span class="subj">${liveEsc(item.objective)}</span><span class="hash">${liveEsc(item.step_id)}</span></div><div class="cev-b"><dl class="kv"><dt>前提</dt><dd>${(item.premises||[]).map(liveEsc).join("；")||"—"}</dd><dt>动作</dt><dd>${liveEsc(item.proposed_move)}</dd><dt>观察</dt><dd>${liveEsc(item.observation)}</dd><dt>证伪</dt><dd>${liveEsc(item.falsification_test)}</dd><dt>决定</dt><dd>${liveEsc(item.decision)}</dd></dl></div></div>`).join("") || `<p class="note">没有公开推理记录。</p>`}</div>`),
    side: liveCard("事实边界","可核验而非私密", `<p class="note">公开推理解释决策；证据和事件链分别记录结论依据与变更历史，三者不能相互替代。</p>`)};
};

V.admin_roles = () => {
  const payload = livePayloadFor("admin_roles"), workspace = liveWorkspace("admin_roles"), policy = payload && payload.role_policy;
  if(!workspace || !policy || !policy.grants) return DEMO_VIEWS.admin_roles();
  const grants = policy.grants, roles = Object.keys(grants).sort();
  const capabilities = [...new Set(roles.flatMap(role=>grants[role]||[]))].sort();
  return { task:`管理端 · 角色与权限 · <b>真实策略</b> · ${roles.length} 个角色`,
    rail: liveCard("角色策略","应用内权限，不是身份提供方", `<p class="note">${liveEsc(policy.boundary)}</p>`),
    main: liveCard("能力矩阵",`${capabilities.length} 项能力 × ${roles.length} 个角色`, `<div class="tw"><table><thead><tr><th>能力</th>${roles.map(role=>`<th>${liveEsc(role)}</th>`).join("")}</tr></thead><tbody>${capabilities.map(capability=>`<tr><td class="mono">${liveEsc(capability)}</td>${roles.map(role=>`<td>${(grants[role]||[]).includes(capability)?"是":"—"}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`),
    side: liveCard("写口边界","控制台不扩大权限", `<p class="note">唯一评审写口仍属于独立评审服务。此导出不携带身份令牌、支付配置或上游凭据。</p>`)};
};

V.campaign = () => {
  const payload = livePayloadFor("campaign"), workspace = liveWorkspace("campaign"); if(!workspace || !payload) return DEMO_VIEWS.campaign();
  const campaign = payload.campaign;
  if(!campaign.available) return { task:"攻克进程 · <b>未提供报告</b>", rail:liveCard("观察站状态","明确不可用",`<p class="note">${liveEsc(campaign.reason)}</p>`), main:liveCard("轮次记录","无报告",`<div class="banner gap"><div>当前工作区未附带 campaign report，控制台不会用演示轮次替代。</div></div>`), side:null };
  const report = campaign.report, rounds = report.rounds || [];
  return { task:`攻克进程 · <b>真实报告</b> · ${rounds.length} 轮`, rail:liveCard("报告边界","只读快照", `<p class="note">报告由受治理的 campaign 运行时产生。此页面不启动、停止或修改攻克进程。</p>`), main:liveCard("轮次记录",`停止原因：${liveEsc(report.stop_reason)}`, `<div class="chain plain">${rounds.map((round,index)=>`<div class="cev open"><div class="cev-h"><span class="seq">${String(index+1).padStart(2,"0")}</span><span class="subj">${liveEsc(round.summary || round.role || "轮次记录")}</span></div><div class="cev-b"><pre class="hash">${liveEsc(JSON.stringify(round, null, 2))}</pre></div></div>`).join("") || `<p class="note">报告没有轮次条目。</p>`}</div>`), side:liveCard("预算","报告快照", `<pre class="hash">${liveEsc(JSON.stringify(report.budget, null, 2))}</pre>`)};
};
/* Console transport is deliberately separate from the demonstration model.
   A compatible export may improve provenance, but never fabricates mappings
   for views whose backend contract has not been implemented. */
const ConsoleBridge = (() => {
  let cursor = -1;
  let eventStream = null;
  let eventEndpoint = null;
  let eventGeneration = null;
  let latestLoad = 0;
  let refreshScheduled = false;
  let reconnectTimer = null;
  const provenance = document.createElement("span");
  provenance.id = "console-provenance";
  provenance.className = "miniprog";
  provenance.setAttribute("role", "status");
  provenance.setAttribute("aria-live", "polite");
  provenance.setAttribute("aria-atomic", "true");
  provenance.textContent = "演示数据";
  document.querySelector(".topbar").insertBefore(provenance, document.getElementById("budget"));
  const label = (text, state) => {
    provenance.textContent = text;
    provenance.dataset.source = state;
  };
  const focusedControl = () => {
    const active = document.activeElement;
    if (!(active instanceof HTMLElement)) return null;
    if (active.id) return { id: active.id };
    if (active.dataset.act) return { act: active.dataset.act, view: active.dataset.v || "" };
    return null;
  };
  const renderPreservingFocus = () => {
    const focus = focusedControl();
    render();
    if (!focus) return;
    const target = focus.id ? document.getElementById(focus.id)
      : [...document.querySelectorAll("[data-act]")].find(item => item instanceof HTMLElement && item.dataset.act === focus.act && (item.dataset.v || "") === focus.view);
    if (target instanceof HTMLElement) target.focus();
  };
  const clearReconnect = () => {
    if (reconnectTimer === null) return;
    window.clearTimeout(reconnectTimer);
    reconnectTimer = null;
  };
  /* run_id is the server-owned workspace identity; state and head digests change as events append. */
  const workspaceGeneration = payload => {
    const runId = payload && payload.provenance && payload.provenance.run_id;
    return typeof runId === "string" && runId.length ? runId : null;
  };
  const eventTail = payload => {
    const events = payload.workspace.events && payload.workspace.events.events;
    if (!Array.isArray(events) || !events.length) return -1;
    const tail = Number(events[events.length - 1].sequence);
    return Number.isInteger(tail) && tail >= 0 ? tail : -1;
  };
  const scheduleReconnect = endpoint => {
    if (reconnectTimer !== null) return;
    reconnectTimer = window.setTimeout(() => {
      reconnectTimer = null;
      connectEvents(endpoint);
    }, 1000);
  };
  const applyExport = (payload, loadId) => {
    if (loadId !== latestLoad) return false;
    if (!payload || payload.schema_version !== "1.0" || !payload.provenance || !payload.workspace || !payload.view_contract || !payload.role_policy || !payload.campaign) return false;
    const generation = workspaceGeneration(payload);
    if (generation === null) return false;
    const tail = eventTail(payload);
    const generationChanged = generation !== eventGeneration;
    const sequenceRestarted = tail < cursor;
    S.consolePayload = payload;
    eventGeneration = generation;
    cursor = generationChanged || sequenceRestarted ? tail : Math.max(cursor, tail);
    const p = payload.provenance;
    label(`已接入工作区 ${p.run_id || "未知"} · ${String(p.state_digest_sha256 || "").slice(0,12)}`, "export");
    if ((generationChanged || sequenceRestarted) && eventEndpoint) connectEvents(eventEndpoint);
    return true;
  };
  const loadExport = async url => {
    const loadId = ++latestLoad;
    try {
      const endpoints = url ? [url] : ["console.json", "/api/console"];
      for (const endpoint of endpoints) {
        if (loadId !== latestLoad) return false;
        const response = await fetch(endpoint, { cache:"no-store", credentials:"same-origin" });
        if (!response.ok) continue;
        const payload = await response.json();
        if (loadId !== latestLoad) return false;
        if (applyExport(payload, loadId)) {
          if (loadId === latestLoad) renderPreservingFocus();
          return true;
        }
      }
      throw new Error("incompatible console export");
    } catch (_) {
      if (loadId === latestLoad) {
        S.consolePayload = null;
        label("演示数据（console.json 不可用）", "fallback");
        renderPreservingFocus();
      }
      return false;
    }
  };
  const connectEvents = endpoint => {
    if (!endpoint || typeof EventSource === "undefined") return false;
    clearReconnect();
    if (eventStream) {
      const previousStream = eventStream;
      eventStream = null;
      previousStream.close();
    }
    eventEndpoint = endpoint;
    const url = new URL(endpoint, window.location.href);
    url.searchParams.set("after", String(cursor));
    const stream = new EventSource(url.toString());
    eventStream = stream;
    const connectionGeneration = eventGeneration;
    stream.addEventListener("research_event", event => {
      if (eventStream !== stream || (connectionGeneration !== null && eventGeneration !== connectionGeneration)) return;
      const nextCursor = Number(event.lastEventId);
      if (!Number.isInteger(nextCursor) || nextCursor < 0) return;
      cursor = Math.max(cursor, nextCursor);
      label(`实时观察 · 事件 ${cursor}`, "live");
      if (!refreshScheduled) {
        refreshScheduled = true;
        window.setTimeout(() => { refreshScheduled = false; loadExport("/api/console"); }, 100);
      }
    });
    stream.onerror = () => {
      if (eventStream !== stream) return;
      eventStream = null;
      stream.close();
      scheduleReconnect(endpoint);
    };
    return true;
  };
  const submitReview = async (endpoint, record, tokenInput) => {
    if (!(tokenInput instanceof HTMLInputElement) || tokenInput.type !== "password") throw new Error("review token must come from a password input");
    const target = new URL(endpoint, window.location.href);
    if (target.origin !== window.location.origin || target.pathname !== "/api/review" || target.search || target.hash) throw new Error("review endpoint must be the same-origin /api/review service");
    const token = tokenInput.value;
    tokenInput.value = "";
    if (!token) throw new Error("review token is required");
    try {
      const response = await fetch(endpoint, { method:"POST", credentials:"same-origin", headers:{"Content-Type":"application/json", "Authorization":`Bearer ${token}`}, body:JSON.stringify(record) });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.message || payload.error || "review rejected");
      return payload;
    } catch (error) {
      toast(`评审提交失败：${error.message}`);
      throw error;
    }
  };
  return { loadExport, connectEvents, submitReview };
})();
window.MathArcConsole = ConsoleBridge;
ConsoleBridge.loadExport().then(loaded => { if (loaded && location.protocol !== "file:") ConsoleBridge.connectEvents("/events"); });
render();
</script>
